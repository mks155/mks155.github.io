<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" width="device-width, initial-scale=1" />
  <title>贪吃蛇</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game {
      width: 420px;
      max-width: 90vw;
      background: #1f2937;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .score {
      font-size: 18px;
      font-weight: 700;
    }

    .controls {
      font-size: 13px;
      color: #9ca3af;
    }

    canvas {
      display: block;
      width: 100%;
      height: 360px;
      border-radius: 12px;
      background: #0f172a;
    }

    .footer {
      margin-top: 12px;
      font-size: 13px;
      color: #9ca3af;
    }

    .restart {
      margin-top: 10px;
      text-align: center;
    }

    button {
      border: none;
      background: #22c55e;
      color: #111827;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="header">
      <div class="score">得分: <span id="score">0</span></div>
      <div class="controls">方向键 / WASD 控制</div>
    </div>

    <canvas id="canvas" width="400" height="360"></canvas>

    <div class="footer">
      空格或 Enter 可以暂停/继续。
    </div>

    <div class="restart">
      <button id="restartBtn">重新开始</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const restartBtn = document.getElementById('restartBtn');

    const cell = 20;
    const cols = canvas.width / cell;
    const rows = canvas.height / cell;

    let snake, dir, nextDir, food, score, alive, paused, speed, lastMove;

    function reset() {
      snake = [
        { x: 10, y: 9 },
        { x: 9, y: 9 },
        { x: 8, y: 9 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = dir;
      score = 0;
      alive = true;
      paused = false;
      speed = 120;
      lastMove = 0;
      placeFood();
      updateScore();
    }

    function placeFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * cols),
          y: Math.floor(Math.random() * rows)
        };
        valid = true;
        for (const part of snake) {
          if (part.x === food.x && part.y === food.y) {
            valid = false;
            break;
          }
        }
      }
    }

    function updateScore() {
      scoreEl.textContent = score;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 背景网格
      ctx.fillStyle = '#111827';
      for (let x = 0; x < cols; x++) {
        for (let y = 0; y < rows; y++) {
          if ((x + y) % 2 === 0) {
            ctx.fillRect(x * cell, y * cell, cell, cell);
          }
        }
      }

      // 食物
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell / 2 - 3, 0, Math.PI * 2);
      ctx.fill();

      // 蛇
      for (let i = 0; i < snake.length; i++) {
        const part = snake[i];
        ctx.fillStyle = i === 0 ? '#22c55e' : '#16a34a';
        ctx.fillRect(part.x * cell + 2, part.y * cell + 2, cell - 4, cell - 4);
      }

      // 游戏状态
      if (!alive) {
        ctx.fillStyle = 'rgba(17, 24, 39, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f87171';
        ctx.font = 'bold 28px Arial';
        ctx.fillText('Game Over', canvas.width / 2 - 70, canvas.height / 2 - 10);
        ctx.font = '16px Arial';
        ctx.fillText('点击按钮重新开始', canvas.width / 2 - 90, canvas.height / 2 + 25);
      } else if (paused) {
        ctx.fillStyle = 'rgba(17, 24, 39, 0.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 24px Arial';
        ctx.fillText('Paused', canvas.width / 2 - 45, canvas.height / 2);
      }
    }

    function move() {
      const head = {
        x: snake[0].x + dir.x,
        y: snake[0].y + dir.y
      };

      // 边界
      if (head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows) {
        alive = false;
        return;
      }

      // 自碰撞
      for (let i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          alive = false;
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        updateScore();
        placeFood();
        if (speed > 70) speed -= 2;
      } else {
        snake.pop();
      }
    }

    function setDirection(x, y) {
      // 防止直接反向
      if (dir.x === -x && dir.y === -y) return;
      nextDir = { x, y };
    }

    function togglePause() {
      paused = !paused;
    }

    function loop(now) {
      if (alive && !paused && now - lastMove >= speed) {
        dir = nextDir;
        move();
        lastMove = now;
      }
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === 'arrowup' || key === 'w') setDirection(0, -1);
      if (key === 'arrowdown' || key === 's') setDirection(0, 1);
      if (key === 'arrowleft' || key === 'a') setDirection(-1, 0);
      if (key === 'arrowright' || key === 'd') setDirection(1, 0);
      if (key === ' ' || key === 'enter') togglePause();
    });

    restartBtn.addEventListener('click', reset);

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
