<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1e1e2f;
    color: #fff;
    font-family: Arial, sans-serif;
  }
  h1 { margin: 0 0 10px; font-size: 28px; }
  #score { margin-bottom: 10px; font-size: 20px; }
  canvas {
    background: #10101a;
    border: 4px solid #444;
    border-radius: 8px;
    display: block;
  }
  #overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.75);
    padding: 24px 32px;
    border-radius: 12px;
    text-align: center;
    display: none;
  }
  button {
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #4caf50;
    color: #fff;
  }
  p { margin-top: 12px; opacity: 0.8; }
</style>
</head>
<body>
<h1>贪吃蛇</h1>
<div id="score">得分：0</div>
<div style="position:relative;">
  <canvas id="game" width="400" height="400"></canvas>
  <div id="overlay">
    <h2 id="msg">游戏结束</h2>
    <button id="restartBtn">重新开始</button>
    <p>按 空格键 也可以重新开始</p>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const msg = document.getElementById('msg');
const restartBtn = document.getElementById('restartBtn');

const GRID = 20;      // 20x20 网格
const CELL = 20;      // 每格 20 像素
const SIZE = GRID * CELL;

let snake, dir, nextDir, food, score, gameOver, timer;

function randomFoodPos() {
  while (true) {
    const pos = {
      x: Math.floor(Math.random() * GRID),
      y: Math.floor(Math.random() * GRID)
    };
    if (!snake.some(s => s.x === pos.x && s.y === pos.y)) return pos;
  }
}

function resetGame() {
  snake = [
    { x: 9, y: 10 },
    { x: 8, y: 10 },
    { x: 7, y: 10 },
    { x: 6, y: 10 }
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  gameOver = false;
  scoreEl.textContent = '得分：0';
  overlay.style.display = 'none';
  food = randomFoodPos();
  if (timer) clearInterval(timer);
  timer = setInterval(update, 120);
}

function draw() {
  ctx.fillStyle = '#10101a';
  ctx.fillRect(0, 0, SIZE, SIZE);

  // 网格线（很淡）
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0);
    ctx.lineTo(i * CELL, SIZE);
    ctx.moveTo(0, i * CELL);
    ctx.lineTo(SIZE, i * CELL);
    ctx.stroke();
  }

  // 食物
  ctx.fillStyle = '#ff4d4d';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
  ctx.fill();

  // 蛇
  snake.forEach((part, index) => {
    ctx.fillStyle = index === 0 ? '#66ff66' : '#2ecc71';
    ctx.fillRect(part.x * CELL + 1, part.y * CELL + 1, CELL - 2, CELL - 2);
  });
}

function showGameOver() {
  gameOver = true;
  clearInterval(timer);
  msg.textContent = `游戏结束，得分：${score}`;
  overlay.style.display = 'block';
}

function update() {
  if (gameOver) return;

  dir = nextDir;

  const head = {
    x: snake[0].x + dir.x,
    y: snake[0].y + dir.y
  };

  // 撞墙
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
    showGameOver();
    return;
  }

  // 咬自己
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    showGameOver();
    return;
  }

  snake.unshift(head);

  // 吃到食物
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = `得分：${score}`;
    food = randomFoodPos();
  } else {
    snake.pop();
  }

  draw();
}

function handleKey(e) {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) {
    e.preventDefault();
  }

  if (k === ' ' && gameOver) {
    resetGame();
    return;
  }

  let newDir = null;
  if (k === 'arrowup' || k === 'w') newDir = { x: 0, y: -1 };
  if (k === 'arrowdown' || k === 's') newDir = { x: 0, y: 1 };
  if (k === 'arrowleft' || k === 'a') newDir = { x: -1, y: 0 };
  if (k === 'arrowright' || k === 'd') newDir = { x: 1, y: 0 };

  if (newDir && (newDir.x !== -dir.x || newDir.y !== -dir.y)) {
    nextDir = newDir;
  }
}

document.addEventListener('keydown', handleKey);
restartBtn.addEventListener('click', resetGame);

resetGame();
</script>
</body>
</html>
