<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { margin-bottom: 10px; font-size: 28px; color: #4ecdc4; }
  .info {
    display: flex;
    gap: 24px;
    margin-bottom: 12px;
    font-size: 16px;
  }
  .info span b { color: #ffd54f; }
  canvas {
    background: #16213e;
    border: 2px solid #4ecdc4;
    border-radius: 6px;
    box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
  }
  .controls { margin-top: 12px; text-align: center; color: #888; font-size: 14px; line-height: 1.8; }
  .btns { margin-top: 10px; display: flex; gap: 10px; }
  button {
    background: #4ecdc4;
    color: #1a1a2e;
    border: none;
    padding: 8px 20px;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #6ee7de; }
  .overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(26, 26, 46, 0.85);
    pointer-events: none;
  }
  .overlay h2 { color: #ff6b6b; font-size: 32px; margin-bottom: 10px; }
  #wrap { position: relative; }
</style>
</head>
<body>
<h1>🐍 贪吃蛇</h1>
<div class="info">
  <span>得分：<b id="score">0</b></span>
  <span>最高分：<b id="high">0</b></span>
  <span>速度：<b id="speed">1</b></span>
</div>
<div id="wrap">
  <canvas id="game" width="400" height="400"></canvas>
  <div class="overlay" id="overlay" style="inset:0;">
    <h2 id="msg">按 空格 / 点击开始</h2>
    <p style="color:#aaa">方向键 / WASD 控制，空格暂停</p>
  </div>
</div>
<div class="btns">
  <button onclick="startGame()">开始 / 重新开始</button>
  <button onclick="togglePause()">暂停 / 继续</button>
</div>
<div class="controls">
  方向键 或 WASD 控制方向 · 空格 暂停/继续 · 吃食物加分，每 5 个食物提速<br>
  撞墙或咬到自己 = 游戏结束
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const COLS = 20, ROWS = 20;
const CELL = canvas.width / COLS;

let snake, dir, nextDir, food, score, high, speedLevel, timer, running, paused, gameOver;

high = parseInt(localStorage.getItem('snakeHigh') || '0');
document.getElementById('high').textContent = high;

function init() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  speedLevel = 1;
  running = false;
  paused = false;
  gameOver = false;
  placeFood();
  draw();
}

function placeFood() {
  while (true) {
    food = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
    if (!snake.some(s => s.x === food.x && s.y === food.y)) break;
  }
}

function stepInterval() {
  return Math.max(60, 150 - (speedLevel - 1) * 12);
}

function startGame() {
  init();
  running = true;
  hideOverlay();
  loop();
}

function loop() {
  clearInterval(timer);
  timer = setInterval(tick, stepInterval());
}

function tick() {
  if (!running || paused) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // 撞墙
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    return endGame();
  }
  // 咬到自己（尾巴即将移走，所以排除最后一格）
  if (snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y)) {
    return endGame();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    if (score % 50 === 0) {
      speedLevel++;
      document.getElementById('speed').textContent = speedLevel;
      loop(); // 用新速度重建计时器
    }
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function endGame() {
  running = false;
  clearInterval(timer);
  gameOver = true;
  if (score > high) {
    high = score;
    localStorage.setItem('snakeHigh', high);
    document.getElementById('high').textContent = high;
  }
  showOverlay('游戏结束！得分 ' + score, '按 空格 / 点击开始再来一局');
}

function togglePause() {
  if (!running || gameOver) return;
  paused = !paused;
  if (paused) showOverlay('已暂停', '按 空格 继续');
  else hideOverlay();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 网格
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
  }

  // 食物
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 3, 0, Math.PI * 2);
  ctx.fill();

  // 蛇
  snake.forEach((seg, i) => {
    const t = i / snake.length;
    ctx.fillStyle = i === 0 ? '#4ecdc4' : `rgba(78, 205, 196, ${1 - t * 0.7})`;
    roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 5);
    ctx.fill();
  });

  // 蛇眼睛
  const head = snake[0];
  ctx.fillStyle = '#1a1a2e';
  const cx = head.x * CELL + CELL/2, cy = head.y * CELL + CELL/2;
  const ex = dir.x * 4, ey = dir.y * 4;
  const px = -dir.y * 5, py = dir.x * 5;
  ctx.beginPath(); ctx.arc(cx + ex + px, cy + ey + py, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + ex - px, cy + ey - py, 2.5, 0, Math.PI*2); ctx.fill();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function showOverlay(title, sub) {
  const ov = document.getElementById('overlay');
  document.getElementById('msg').textContent = title;
  ov.querySelector('p').textContent = sub;
  ov.style.display = 'flex';
}

function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ') {
    e.preventDefault();
    if (!running || gameOver) startGame();
    else togglePause();
    return;
  }
  const map = {
    arrowup:    {x: 0, y: -1}, w: {x: 0, y: -1},
    arrowdown:  {x: 0, y: 1},  s: {x: 0, y: 1},
    arrowleft:  {x: -1, y: 0}, a: {x: -1, y: 0},
    arrowright: {x: 1, y: 0},  d: {x: 1, y: 0}
  };
  const nd = map[k];
  if (!nd) return;
  e.preventDefault();
  // 禁止 180° 掉头
  if (nd.x === -dir.x && nd.y === -dir.y) return;
  nextDir = nd;
});

canvas.addEventListener('click', () => {
  if (!running || gameOver) startGame();
});

init();
</script>
</body>
</html>
