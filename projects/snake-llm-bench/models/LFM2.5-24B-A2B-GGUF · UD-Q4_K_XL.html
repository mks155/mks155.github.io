<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .score-display {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .score-label {
            font-size: 0.9rem;
            color: #aaa;
        }

        .score-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4ade80;
        }

        #gameCanvas {
            border: 4px solid #4ade80;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.3);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #4ade80;
            color: #1a1a2e;
            font-weight: bold;
        }

        button:hover {
            background: #22c55e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 222, 128, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .instructions {
            margin-top: 15px;
            color: #888;
            font-size: 0.9rem;
        }

        #message {
            margin-top: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 30px;
        }

        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .game-over.hidden {
            display: none;
        }

        .game-over h2 {
            color: #f87171;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .game-over p {
            color: #ccc;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>🐍 贪吃蛇游戏</h1>
    
    <div class="score-display">
        <div class="score-label">得分: <span class="score-value" id="score">0</span></div>
        <div class="score-label">长度: <span class="score-value" id="length">3</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        <button id="restartBtn">重新开始</button>
    </div>

    <div class="instructions">
        <p>使用方向键控制蛇的移动</p>
    </div>

    <div id="message"></div>

    <script>
        // 游戏配置
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const lengthElement = document.getElementById('length');
        const messageElement = document.getElementById('message');
        const restartBtn = document.getElementById('restartBtn');

        const GRID_SIZE = 20;  // 每个格子的大小
        const TILE_COUNT = canvas.width / GRID_SIZE;  // 画布上的格子数量

        // 游戏状态
        let snake = [];
        let food = { x: 5, y: 5 };
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let gameSpeed = 100;  // 游戏速度（毫秒）
        let gameRunning = false;
        let gameLoop;

        // 初始化游戏
        function initGame() {
            // 初始化蛇
            snake = [
                { x: 5, y: 5 },
                { x: 4, y: 5 },
                { x: 3, y: 5 }
            ];
            
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameSpeed = 100;
            
            scoreElement.textContent = score;
            lengthElement.textContent = snake.length;
            
            messageElement.textContent = '';
            
            placeFood();
            
            if (gameLoop) {
                clearInterval(gameLoop);
            }
            
            gameRunning = true;
            gameLoop = setInterval(update, gameSpeed);
        }

        // 放置食物
        function placeFood() {
            // 随机生成食物位置
            food.x = Math.floor(Math.random() * TILE_COUNT);
            food.y = Math.floor(Math.random() * TILE_COUNT);
            
            // 检查食物是否和蛇重叠
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    placeFood();
                    return;
                }
            }
        }

        // 更新游戏状态
        function update() {
            // 更新方向（使用nextDirection防止在同一帧多次改变方向）
            direction = { ...nextDirection };
            
            // 计算新头部位置
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };
            
            // 碰撞检测：墙壁
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }
            
            // 碰撞检测：自己
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }
            
            // 添加新头部
            snake.unshift(head);
            
            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                lengthElement.textContent = snake.length;
                placeFood();
                
                // 增加速度（可选）
                if (gameSpeed > 50) {
                    gameSpeed -= 2;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, gameSpeed);
                }
            } else {
                // 移除尾部（保持长度不变）
                snake.pop();
            }
            
            draw();
        }

        // 绘制游戏
        function draw() {
            // 清除画布
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制蛇
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                
                // 蛇身体颜色渐变
                const hue = (i * 30) % 360;
                ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
                
                // 绘制矩形
                ctx.fillRect(
                    segment.x * GRID_SIZE,
                    segment.y * GRID_SIZE,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2
                );
                
                // 画眼睛（可选）
                if (i === snake.length - 1) {
                    ctx.fillStyle = '#1a1a2e';
                    ctx.fillRect(
                        segment.x * GRID_SIZE + 5,
                        segment.y * GRID_SIZE + 5,
                        4,
                        4
                    );
                }
            }
            
            // 绘制食物
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // 绘制边框
            ctx.strokeStyle = '#4ade80';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            
            messageElement.textContent = '游戏结束！按重新开始按钮再玩一次';
            
            restartBtn.style.display = 'block';
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                    if (direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    }
                    break;
                case 'ArrowDown':
                    if (direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    }
                    break;
                case 'ArrowLeft':
                    if (direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    }
                    break;
                case 'ArrowRight':
                    if (direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    }
                    break;
            }
        });

        // 重新开始按钮
        restartBtn.addEventListener('click', initGame);

        // 启动游戏
        initGame();
    </script>
</body>
</html>
