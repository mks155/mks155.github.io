<html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>贪吃蛇游戏</title> <style> body { margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #f0f0f0; font-family: Arial, sans-serif; } #gameCanvas { border: 2px solid #333; background-color: #fff; } .controls { margin-top: 20px; color: #333; } </style> </head> <body> <h1>贪吃蛇游戏</h1> <canvas id="gameCanvas" width="500" height="500"></canvas> <div class="controls"> <p>使用方向键控制蛇移动 | 按空格键重新开始</p> <p id="status">游戏进行中...</p> </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusElement = document.getElementById('status');

    // 游戏变量
    let snake = [
        {x: 250, y: 250},
        {x: 240, y: 250},
        {x: 230, y: 250}
    ];
    let direction = 'right';
    let food = {};
    let gameOver = false;
    let score = 0;
    const gridSize = 10;
    const initialSpeed = 150; // 毫秒

    // 初始化食物
    function generateFood() {
        const x = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
        const y = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
        return {x, y};
    }

    // 重置游戏
    function resetGame() {
        snake = [
            {x: 250, y: 250},
            {x: 240, y: 250},
            {x: 230, y: 250}
        ];
        direction = 'right';
        food = generateFood();
        score = 0;
        gameOver = false;
        statusElement.textContent = '游戏进行中...';
        clearInterval(gameLoop);
        gameLoop = setInterval(gameStep, initialSpeed);
    }

    // 移动蛇
    function moveSnake() {
        const head = {x: snake[0].x, y: snake[0].y};
        
        switch(direction) {
            case 'up': head.y -= gridSize; break;
            case 'down': head.y += gridSize; break;
            case 'left': head.x -= gridSize; break;
            case 'right': head.x += gridSize; break;
        }
        
        snake.unshift(head);
        
        // 检查是否吃到食物
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            food = generateFood();
            // 增加速度（可选）
            if (initialSpeed > 50) {
                initialSpeed -= 5;
                clearInterval(gameLoop);
                gameLoop = setInterval(gameStep, initialSpeed);
            }
        } else {
            snake.pop();
        }
    }

    // 检查碰撞
    function checkCollisions() {
        const head = snake[0];
        
        //  walls collision
        if (
            head.x < 0 || 
            head.x >= canvas.width || 
            head.y < 0 || 
            head.y >= canvas.height
        ) {
            gameOver = true;
            statusElement.textContent = `游戏结束！得分: ${score}`;
            clearInterval(gameLoop);
        }
        
        // self collision
        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                gameOver = true;
                statusElement.textContent = `游戏结束！得分: ${score}`;
                clearInterval(gameLoop);
                break;
            }
        }
    }

    // 绘制游戏元素
    function draw() {
        // 清屏
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 绘制蛇
        ctx.fillStyle = 'green';
        snake.forEach(segment => {
            ctx.fillRect(segment.x, segment.y, gridSize, gridSize);
        });
        
        // 绘制食物
        ctx.fillStyle = 'red';
        ctx.fillRect(food.x, food.y, gridSize, gridSize);
        
        // 绘制分数
        ctx.fillStyle = 'black';
        ctx.font = '20px Arial';
        ctx.fillText(`得分: ${score}`, 20, 30);
    }

    // 游戏循环步骤
    function gameStep() {
        if (gameOver) return;
        moveSnake();
        checkCollisions();
        draw();
    }

    // 键盘控制
    document.addEventListener('keydown', (e) => {
        if (gameOver && e.key === ' ') {
            resetGame();
            return;
        }
        
        if (gameOver) return;
        
        switch(e.key) {
            case 'ArrowUp':
                if (direction !== 'down') direction = 'up';
                break;
            case 'ArrowDown':
                if (direction !== 'up') direction = 'down';
                break;
            case 'ArrowLeft':
                if (direction !== 'right') direction = 'left';
                break;
            case 'ArrowRight':
                if (direction !== 'left') direction = 'right';
                break;
        }
    });

    // 初始化游戏
    let gameLoop = setInterval(gameStep, initialSpeed);
    food = generateFood();
    draw();
</script>
</body> </html>
