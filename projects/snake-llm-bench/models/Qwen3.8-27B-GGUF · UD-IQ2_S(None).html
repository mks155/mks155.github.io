<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #24243e, #30276b);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
  }

  .game-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  h1 {
    font-size: 28px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #00ffcc, #00aaff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
  }

  .info-bar {
    display: flex;
    gap: 24px;
    font-size: 16px;
    color: #ccc;
  }

  .info-bar span {
    color: #00ffcc;
    font-weight: bold;
  }

  canvas {
    border: 2px solid rgba(0, 255, 204, 0.3);
    border-radius: 8px;
    background: #1a1a2e;
    box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
  }

  .controls {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: bold;
  }

  .btn-start { background: #00cc88; color: #fff; }
  .btn-start:hover { background: #00ffaa; box-shadow: 0 0 15px rgba(0, 255, 170, 0.4); }
  .btn-pause { background: #e67e22; color: #fff; }
  .btn-pause:hover { background: #f39c12; box-shadow: 0 0 15px rgba(243, 156, 18, 0.4); }

  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    z-index: 10;
  }

  .overlay h2 {
    font-size: 36px;
    margin-bottom: 16px;
    color: #ff475e;
  }

  .overlay p {
    font-size: 18px;
    color: #ccc;
    margin-bottom: 20px;
  }

  .overlay button {
    padding: 12px 32px;
    font-size: 16px;
    background: #ff475e;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .overlay button:hover {
    background: #ff6b81;
    box-shadow: 0 0 20px rgba(255, 71, 94, 0.5);
  }

  .hidden { display: none !important; }

  .touch-controls {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 4px;
    margin-top: 12px;
    user-select: none;
  }

  .touch-btn {
    width: 60px;
    height: 60px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    color: #fff;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .touch-btn:active { background: rgba(0, 255, 204, 0.3); }

  .touch-up { grid-column: 2; grid-row: 1; }
  .touch-left { grid-column: 1; grid-row: 2; }
  .touch-down { grid-column: 2; grid-row: 3; }
  .touch-right { grid-column: 3; grid-row: 2; }

  @media (max-width: 600px) {
    h1 { font-size: 20px; }
    .info-bar { font-size: 14px; gap: 16px; }
    canvas { width: 100% !important; height: auto !important; }
  }
</style>
</head>
<body>

<div class="game-container">
  <h1>🐍 贪吃蛇</h1>
  <div class="info-bar">
    <div>得分: <span id="score">0</span></div>
    <div>最高分: <span id="highScore">0</span></div>
    <div>长度: <span id="length">3</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <div class="controls">
    <button class="btn-start" id="startBtn">开始游戏</button>
    <button class="btn-pause" id="pauseBtn">暂停</button>
  </div>

  <!-- 移动端方向按钮 -->
  <div class="touch-controls" id="touchControls">
    <div class="touch-btn touch-up">↑</div>
    <div class="touch-btn touch-left">←</div>
    <div class="touch-btn touch-down">↓</div>
    <div class="touch-btn touch-right">→</div>
  </div>

  <!-- 游戏结束遮罩 -->
  <div class="overlay hidden" id="gameOverOverlay">
    <h2>游戏结束</h2>
    <p>最终得分: <span id="finalScore">0</span></p>
    <button id="restartBtn">再来一局</button>
  </div>

  <!-- 暂停遮罩 -->
  <div class="overlay hidden" id="pauseOverlay">
    <h2 style="color:#f39c12;">已暂停</h2>
    <p>按空格键或点击按钮继续</p>
    <button id="resumeBtn">继续游戏</button>
  </div>
</div>

<script>
// ==================== 游戏配置 ====================
const GRID_SIZE = 20;          // 每格像素
const COLS = 20;               // 列数
const ROWS = 20;               // 行数
const INITIAL_SPEED = 150;     // 初始速度(ms)
const SPEED_INCREMENT = 3;     // 每次吃食物后加速

// ==================== DOM ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const lengthEl = document.getElementById('length');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const pauseOverlay = document.getElementById('pauseOverlay');
const finalScoreEl = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');
const resumeBtn = document.getElementById('resumeBtn');

// 高分持久化
let highScore = parseInt(localStorage.getItem('snakeHighScore') || '0');
highScoreEl.textContent = highScore;

// ==================== 游戏状态 ====================
let snake = [];
let food = { x: 10, y: 10 };
let dx = 1, dy = 0;           // 方向
let score = 0;
let speed = INITIAL_SPEED;
let gameRunning = false;
let paused = false;
let animId = null;

// ==================== 初始化 ====================
function initSnake() {
  snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
  ];
}

function placeFood() {
  let x, y;
  do {
    x = Math.floor(Math.random() * COLS);
    y = Math.floor(Math.random() * ROWS);
  } while (snake.some(s => s.x === x && s.y === y));
  food = { x, y };
}

// ==================== 绘制 ====================
function drawGrid() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 细网格线
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * GRID_SIZE, 0);
    ctx.lineTo(i * GRID_SIZE, canvas.height);
    ctx.stroke();
  }
  for (let j = 0; j <= ROWS; j++) {
    ctx.beginPath();
    ctx.moveTo(0, j * GRID_SIZE);
    ctx.lineTo(canvas.width, j * GRID_SIZE);
    ctx.stroke();
  }
}

function drawSnake() {
  snake.forEach((seg, i) => {
    const x = seg.x * GRID_SIZE;
    const y = seg.y * GRID_SIZE;
    const padding = 1;

    if (i === 0) {
      // 头部 - 亮绿色
      ctx.fillStyle = '#00ff88';
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur = 12;
      roundRect(ctx, x + padding, y + padding, GRID_SIZE - padding * 2, GRID_SIZE - padding * 2, 6);
      // 眼睛
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x + GRID_SIZE * 0.35, y + GRID_SIZE * 0.35, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + GRID_SIZE * 0.65, y + GRID_SIZE * 0.35, 2.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // 身体 - 渐变绿
      const hue = 140 - i * 2;
      ctx.fillStyle = `hsl(${hue}, 80%, ${Math.max(35, 50 - i * 2)}%)`;
      ctx.shadowColor = 'rgba(0, 255, 136, 0.2)';
      ctx.shadowBlur = 4;
      roundRect(ctx, x + padding, y + padding, GRID_SIZE - padding * 2, GRID_SIZE - padding * 2, 4);
    }
    ctx.shadowBlur = 0;
  });
}

function drawFood() {
  const x = food.x * GRID_SIZE;
  const y = food.y * GRID_SIZE;
  const cx = x + GRID_SIZE / 2;
  const cy = y + GRID_SIZE / 2;
  const r = GRID_SIZE / 2 - 3;

  // 发光效果
  ctx.shadowColor = '#ff475e';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#ff475e';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // 高光
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.beginPath();
  ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.3, 0, Math.PI * 2);
  ctx.fill();

  // 小光点脉冲
  const pulse = Math.sin(Date.now() / 200) * 2;
  ctx.strokeStyle = 'rgba(255, 71, 94, 0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, r + pulse, 0, Math.PI * 2);
  ctx.stroke();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
}

function render() {
  drawGrid();
  drawFood();
  drawSnake();
}

// ==================== 游戏逻辑 ====================
function update() {
  const head = {
    x: snake[0].x + dx,
    y: snake[0].y + dy
  };

  // 撞墙检测
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    gameOver();
    return;
  }

  // 撞自己检测（尾部即将移动的位置除外）
  for (let i = 0; i < snake.length - 1; i++) {
    if (head.x === snake[i].x && head.y === snake[i].y) {
      gameOver();
      return;
    }
  }

  // 移动
  snake.unshift(head);

  // 吃到食物
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    speed = Math.max(50, INITIAL_SPEED - SPEED_INCREMENT * Math.floor(score / 10));
    placeFood();
    updateScore();
  } else {
    snake.pop(); // 没吃到就移除尾巴
  }

  render();
}

function gameLoop() {
  if (!gameRunning || paused) return;
  update();
  animId = setTimeout(() => requestAnimationFrame(gameLoop), speed);
}

// ==================== 控制 ====================
function setDirection(newDx, newDy) {
  // 防止180度掉头
  if (newDx === -dx && newDy === -dy) return;
  dx = newDx;
  dy = newDy;
}

function startGame() {
  initSnake();
  placeFood();
  score = 0;
  speed = INITIAL_SPEED;
  dx = 1;
  dy = 0;
  gameRunning = true;
  paused = false;

  updateScore();
  gameOverOverlay.classList.add('hidden');
  pauseOverlay.classList.add('hidden');
  startBtn.textContent = '重新开始';
  pauseBtn.textContent = '暂停';

  render();
  clearTimeout(animId);
  gameLoop();
}

function gameOver() {
  gameRunning = false;
  clearTimeout(animId);

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snakeHighScore', highScore.toString());
  }
  highScoreEl.textContent = highScore;
  finalScoreEl.textContent = score;
  gameOverOverlay.classList.remove('hidden');
}

function togglePause() {
  if (!gameRunning) return;
  paused = !paused;
  if (paused) {
    clearTimeout(animId);
    pauseOverlay.classList.remove('hidden');
    pauseBtn.textContent = '继续';
  } else {
    pauseOverlay.classList.add('hidden');
    pauseBtn.textContent = '暂停';
    gameLoop();
  }
}

function updateScore() {
  scoreEl.textContent = score;
  lengthEl.textContent = snake.length;
}

// ==================== 事件绑定 ====================
startBtn.addEventListener('click', startGame);
pauseBtn.addEventListener('click', togglePause);
restartBtn.addEventListener('click', startGame);
resumeBtn.addEventListener('click', togglePause);

// 键盘控制
document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W':
      setDirection(0, -1); break;
    case 'ArrowDown': case 's': case 'S':
      setDirection(0, 1); break;
    case 'ArrowLeft': case 'a': case 'A':
      setDirection(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D':
      setDirection(1, 0); break;
    case ' ':
      e.preventDefault();
      if (gameRunning) togglePause();
      else startGame();
      break;
  }
});

// 移动端触屏滑动
let touchStartX = 0, touchStartY = 0;

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (!gameRunning || paused) return;

  const touch = e.changedTouches[0];
  const dxTouch = touch.clientX - touchStartX;
  const dyTouch = touch.clientY - touchStartY;

  // 判断滑动方向（最小移动距离15px）
  if (Math.abs(dxTouch) > Math.abs(dyTouch)) {
    if (dxTouch > 15) setDirection(1, 0);      // 右
    else if (dxTouch < -15) setDirection(-1, 0); // 左
  } else {
    if (dyTouch > 15) setDirection(0, 1);       // 下
    else if (dyTouch < -15) setDirection(0, -1); // 上
  }
}, { passive: false });

// 移动端方向按钮
document.querySelector('.touch-up').addEventListener('click', () => setDirection(0, -1));
document.querySelector('.touch-down').addEventListener('click', () => setDirection(0, 1));
document.querySelector('.touch-left').addEventListener('click', () => setDirection(-1, 0));
document.querySelector('.touch-right').addEventListener('click', () => setDirection(1, 0));

// ==================== 启动画面渲染 ====================
initSnake();
placeFood();
render();
</script>

</body>
</html>
