<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 贪吃蛇</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', 'PingFang SC', sans-serif;
    color: #fff;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    color: #7cfc7c;
    text-shadow: 0 0 20px rgba(124, 252, 124, 0.4);
  }

  .score-bar {
    display: flex;
    gap: 30px;
    margin-bottom: 15px;
    font-size: 1.1rem;
  }

  .score-bar span {
    background: rgba(255, 255, 255, 0.1);
    padding: 6px 16px;
    border-radius: 8px;
  }

  .game-container {
    position: relative;
    border: 3px solid #7cfc7c;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(124, 252, 124, 0.2);
    overflow: hidden;
  }

  canvas {
    display: block;
    background: #162138;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(26, 26, 46, 0.85);
    backdrop-filter: blur(4px);
    z-index: 10;
  }

  .overlay.hidden {
    display: none;
  }

  .overlay h2 {
    font-size: 2rem;
    color: #ff6b6b;
    margin-bottom: 10px;
  }

  .overlay p {
    font-size: 1.2rem;
    margin-bottom: 20px;
    color: #ccc;
  }

  .overlay button {
    background: #7cfc7c;
    color: #1a1a2e;
    border: none;
    padding: 12px 32px;
    font-size: 1.1rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .overlay button:hover {
    background: #9eff9e;
    transform: scale(1.05);
  }

  .controls {
    margin-top: 15px;
    font-size: 0.95rem;
    color: #888;
  }

  .controls kbd {
    background: rgba(255,255,255,0.15);
    padding: 3px 8px;
    border-radius: 4px;
    margin: 0 2px;
    font-family: monospace;
  }
</style>
</head>
<body>

<h1>🐍 贪吃蛇</h1>

<div class="score-bar">
  <span>🍎 得分: <strong id="score">0</strong></span>
  <span>🏆 最高: <strong id="highScore">0</strong></span>
</div>

<div class="game-container" id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="overlayTitle">🐍 贪吃蛇</h2>
    <p id="overlayText">按空格开始游戏！</p>
    <button id="startBtn">开始游戏</button>
  </div>
</div>

<div class="controls">
  <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 &nbsp;|&nbsp; <kbd>Space</kbd> 暂停/继续
</div>

<script>
(() => {
  // ==================== 配置 ====================
  const GRID = 20;          // 网格大小
  const COLS = 24;          // 列数
  const ROWS = 16;          // 行数
  const CELL = 30;          // 每格像素
  const SPEED_MS = 120;     // 每步毫秒
  const FOOD_SCORE = 10;

  // ==================== 画布 ====================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width  = COLS * CELL;
  canvas.height = ROWS * CELL;

  // ==================== 状态 ====================
  let snake = [];
  let food  = null;
  let dir   = { x: 1, y: 0 };
  let nextDir = { x: 1, y: 0 };
  let score = 0;
  let highScore = parseInt(localStorage.getItem('snakeHigh') || '0');
  let running = false;
  let paused = false;
  let lastTick = 0;
  let animId = null;

  document.getElementById('highScore').textContent = highScore;

  // ==================== 初始化 ====================
  function reset() {
    snake = [
      { x: 10, y: 8 },
      { x: 9,  y: 8 },
      { x: 8,  y: 8 },
    ];
    nextDir = { x: 1, y: 0 };
    dir = { x: 1, y: 0 };
    score = 0;
    spawnFood();
    updateScore();
  }

  function spawnFood() {
    do {
      food = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS),
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function updateScore() {
    document.getElementById('score').textContent = score;
  }

  // ==================== 游戏循环 ====================
  function tick() {
    if (!running || paused) return;

    const now = performance.now();
    if (now - lastTick < SPEED_MS) return;
    lastTick = now;

    // 移动
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver();
      return;
    }

    // 撞自己（不含尾部，因为尾部即将移除）
    if (snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    // 吃到食物
    if (head.x === food.x && head.y === food.y) {
      score += FOOD_SCORE;
      updateScore();
      spawnFood();
    } else {
      snake.pop();
    }
    snake.unshift(head);

    draw();
  }

  function loop() {
    tick();
    animId = requestAnimationFrame(loop);
  }

  // ==================== 绘制 ====================
  function draw() {
    // 背景
    ctx.fillStyle = '#162138';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格线（淡）
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
    }
    for (let i = 1; i < ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // 食物
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = '#ff6b6b';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = '#ff9e9e';
    ctx.fill();

    // 蛇身
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const x = s.x * CELL;
      const y = s.y * CELL;
      const r = CELL * 0.42;

      if (i === 0) {
        // 头
        ctx.beginPath();
        ctx.arc(x + CELL / 2, y + CELL / 2, r, 0, Math.PI * 2);
        ctx.fillStyle = '#7cfc7c';
        ctx.fill();
        // 眼睛
        const ex1 = x + CELL / 2 + dir.x * 5 - dir.y * 5;
        const ey1 = y + CELL / 2 - dir.x * 5 - dir.y * 5;
        const ex2 = x + CELL / 2 + dir.x * 5 + dir.y * 5;
        const ey2 = y + CELL / 2 - dir.x * 5 + dir.y * 5;
        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath(); ctx.arc(ex1, ey1, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex2, ey2, 3, 0, Math.PI*2); ctx.fill();
      } else {
        // 身体
        ctx.beginPath();
        ctx.arc(x + CELL / 2, y + CELL / 2, r, 0, Math.PI * 2);
        const t = i / snake.length;
        const g = Math.max(120, Math.floor(252 - t * 80));
        ctx.fillStyle = `rgb(${Math.floor(124 + t * 30)}, ${g}, ${Math.floor(124 + t * 30)})`;
        ctx.fill();
      }
    }
  }

  // ==================== 游戏结束 ====================
  function gameOver() {
    running = false;
    paused = false;
    if (animId) cancelAnimationFrame(animId);
    animId = null;

    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHigh', String(highScore));
      document.getElementById('highScore').textContent = highScore;
    }

    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    document.getElementById('overlayTitle').textContent = '💀 游戏结束';
    document.getElementById('overlayText').textContent =
      `最终得分: ${score}  |  最高纪录: ${highScore}`;
    document.getElementById('startBtn').textContent = '再来一局';
  }

  // ==================== 开始 / 暂停 ====================
  function start() {
    reset();
    running = true;
    paused = false;
    lastTick = performance.now();
    document.getElementById('overlay').classList.add('hidden');
    draw();
    if (!animId) loop();
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      const overlay = document.getElementById('overlay');
      overlay.classList.remove('hidden');
      document.getElementById('overlayTitle').textContent = '⏸ 已暂停';
      document.getElementById('overlayText').textContent = '按空格继续';
      document.getElementById('startBtn').textContent = '继续';
    } else {
      document.getElementById('overlay').classList.add('hidden');
      lastTick = performance.now();
    }
  }

  // ==================== 输入 ====================
  const keyMap = {
    ArrowUp:    { x: 0, y: -1 },
    ArrowDown:  { x: 0, y: 1 },
    ArrowLeft:  { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 },
    s: { x: 0, y: 1 },
    a: { x: -1, y: 0 },
    d: { x: 1, y: 0 },
  };

  document.addEventListener('keydown', (e) => {
    const key = e.key;

    if (key === ' ' || key === 'Space') {
      e.preventDefault();
      if (!running) {
        start();
      } else {
        togglePause();
      }
      return;
    }

    if (!running || paused) return;

    const nd = keyMap[key];
    if (!nd) return;

    // 防止 180° 掉头
    if (nd.x === -dir.x && nd.y === -dir.y) return;

    nextDir = nd;
    e.preventDefault();
  });

  document.getElementById('startBtn').addEventListener('click', start);
})();
</script>

</body>
</html>
