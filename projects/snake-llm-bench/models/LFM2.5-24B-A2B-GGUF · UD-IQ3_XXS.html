<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇游戏</title>
<style>
 body {
 margin: 0;
 display: flex;
 justify-content: center;
 align-items: center;
 height: 100vh;
 background: #1a1a2e;
 font-family: Arial, sans-serif;
 }
 #game-container {
 text-align: center;
 }
 canvas {
 background: #0f0f23;
 border: 2px solid #4a4a6a;
 }
 #score {
 color: #e0e0e0;
 font-size: 24px;
 margin-top: 10px;
 }
 #message {
 color: #ff6b6b;
 font-size: 20px;
 margin-top: 10px;
 }
</style>
</head>
<body>
<div id="game-container">
 <canvas id="gameCanvas" width="400" height="400"></canvas>
 <div id="score">得分: 0</div>
 <div id="message">方向: 上</div>
 <button id="restartBtn">重新开始</button>
</div>
<script>
 const canvas = document.getElementById('gameCanvas');
 const ctx = canvas.getContext('2d');
 const scoreEl = document.getElementById('score');
 const messageEl = document.getElementById('message');
 const restartBtn = document.getElementById('restartBtn');

 const gridSize = 20;
 const tileCount = canvas.width / gridSize;

 let snake = [{x: 10, y: 10}];
 let direction = 'right';
 let nextDirection = 'right';
 let food = null;
 let score = 0;
 let gameRunning = true;

 function initGame() {
 snake = [{x: 10, y: 10}];
 direction = 'right';
 nextDirection = 'right';
 score = 0;
 messageEl.textContent = '方向: 上';
 scoreEl.textContent = '得分: 0';
 placeFood();
 gameRunning = true;
 draw();
 }

 function placeFood() {
 while (true) {
 const x = Math.floor(Math.random() * tileCount);
 const y = Math.floor(Math.random() * tileCount);
 if (!snake.some(seg => seg.x === x && seg.y === y)) {
 food = {x, y};
 break;
 }
 }
 }

 function draw() {
 ctx.fillStyle = '#0f0f23';
 ctx.fillRect(0, 0, canvas.width, canvas.height);

 // 画蛇
 ctx.fillStyle = '#00ff88';
 snake.forEach((seg, index) => {
 ctx.fillRect(seg.x * gridSize, seg.y * gridSize, gridSize - 1, gridSize - 1);
 });

 // 画食物
 ctx.fillStyle = '#ff4757';
 ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 1, gridSize - 1);
 }

 function update() {
 if (!gameRunning) return;

 // 更新方向
 direction = nextDirection;

 // 计算新头部位置
 const head = {x: snake[0].x, y: snake[0].y};
 if (nextDirection === 'up') head.y -= 1;
 else if (nextDirection === 'down') head.y += 1;
 else if (nextDirection === 'left') head.x -= 1;
 else if (nextDirection === 'right') head.x += 1;

 // 碰撞检测：边界
 if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
 gameOver();
 return;
 }

 // 碰撞检测：自身
 if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
 gameOver();
 return;
 }

 // 添加新头部
 snake.unshift(head);

 // 吃食物
 if (head.x === food.x && head.y === food.y) {
 score++;
 scoreEl.textContent = '得分: ' + score;
 placeFood();
 } else {
 snake.pop();
 }

 draw();
 }

 function gameOver() {
 gameRunning = false;
 messageEl.textContent = '游戏结束！得分: ' + score;
 }

 // 键盘控制
 document.addEventListener('keydown', (e) => {
 const key = e.key.toLowerCase();
 if (key === 'arrowup' || key === 'w') {
 if (nextDirection !== 'down') nextDirection = 'up';
 messageEl.textContent = '方向: 上';
 }
 if (key === 'arrowdown' || key === 's') {
 if (nextDirection !== 'up') nextDirection = 'down';
 messageEl.textContent = '方向: 下';
 }
 if (key === 'arrowleft' || key === 'a') {
 if (nextDirection !== 'right') nextDirection = 'left';
 messageEl.textContent = '方向: 左';
 }
 if (key === 'arrowright' || key === 'd') {
 if (nextDirection !== 'left') nextDirection = 'right';
 messageEl.textContent = '方向: 右';
 }
 });

 restartBtn.addEventListener('click', initGame);

 // 初始启动
 initGame();
 // 自动运行循环
 setInterval(update, 150);
</script>
</body>
</html>
