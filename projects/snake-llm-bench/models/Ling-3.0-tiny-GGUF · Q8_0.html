<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00ff88, #ff6b6b, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        .score-board {
            display: flex;
            gap: 30px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .score-value {
            color: #00ff88;
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .score-value.best {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .canvas-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.2), 
                         0 0 80px rgba(0, 255, 136, 0.1);
            border: 2px solid rgba(0, 255, 136, 0.3);
        }

        canvas {
            display: block;
            background: #0a0a1a;
            cursor: pointer;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 10;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .overlay h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00ff88, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .overlay p {
            font-size: 1.1rem;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .overlay .final-score {
            font-size: 2rem;
            color: #ffd700;
            margin: 15px 0;
            font-weight: 700;
        }

        .overlay .new-best {
            color: #ff6b6b;
            font-size: 1rem;
            margin-bottom: 20px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(0, 255, 136, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(255, 107, 107, 0.5);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .instructions {
            margin-top: 15px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .instructions kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-family: monospace;
        }

        .game-over-reason {
            color: #ff6b6b;
            font-size: 1rem;
            margin-top: 10px;
            opacity: 0.8;
        }

        .tutorial {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .tutorial.show {
            opacity: 1;
        }

        .tutorial .tip {
            color: #00ff88;
            margin-right: 10px;
        }

        @media (max-width: 480px) {
            .title {
                font-size: 1.8rem;
            }
            
            .score-board {
                gap: 15px;
            }
            
            .score-value {
                font-size: 1.4rem;
            }
            
            .overlay h1 {
                font-size: 2.2rem;
            }
            
            .btn {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 class="title">贪吃蛇</h1>
            <div class="score-board">
                <div class="score-item">
                    <span class="score-label">分数</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">最高分</span>
                    <span class="score-value best" id="best-score">0</span>
                </div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div class="overlay active" id="start-screen">
                <h1>贪吃蛇</h1>
                <p>控制蛇吃食物，避免撞墙和自身</p>
                <div class="new-best" id="new-best-message" style="display: none;">🎉 新纪录！</div>
                <button class="btn btn-primary" id="start-btn">开始游戏</button>
                <div class="controls">
                    <button class="control-btn" id="pause-btn">⏸</button>
                </div>
                <div class="instructions">
                    <p>使用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 控制方向</p>
                    <p>按 <kbd>P</kbd> 暂停游戏 | 移动端支持滑动</p>
                </div>
            </div>

            <div class="overlay" id="game-over-screen">
                <h1>游戏结束</h1>
                <div class="final-score" id="final-score">0</div>
                <div class="game-over-reason" id="game-over-reason">撞墙了！</div>
                <div class="new-best" id="new-best-message-over" style="display: none;">🎉 新纪录！</div>
                <button class="btn btn-primary" id="restart-btn">重新开始</button>
                <button class="btn btn-secondary" id="menu-btn">返回菜单</button>
            </div>

            <div class="tutorial" id="tutorial">
                <span class="tip">← →</span> 移动
                <span class="tip">↑ ↓</span>
                <span class="tip">空格</span> 暂停
            </div>
        </div>
    </div>

    <script>
        // 游戏状态
        const gameState = {
            gridSize: 20,
            cellSize: 20,
            snake: [],
            food: { x: 0, y: 0 },
            direction: 'right',
            nextDirection: 'right',
            score: 0,
            bestScore: parseInt(localStorage.getItem('snakeBestScore') || '0'),
            gameSpeed: 120,
            gameLoop: null,
            isRunning: false,
            isPaused: false,
            isGameOver: false,
            particles: [],
            foodPulse: 0,
            lastMoveTime: 0,
            trail: []
        };

        // DOM 元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('best-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const menuBtn = document.getElementById('menu-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const finalScoreEl = document.getElementById('final-score');
        const gameOverReasonEl = document.getElementById('game-over-reason');
        const newBestMsg = document.getElementById('new-best-message');
        const newBestMsgOver = document.getElementById('new-best-message-over');
        const tutorial = document.getElementById('tutorial');

        // 音效系统
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch (type) {
                case 'eat':
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.05);
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.2);
                    break;
                case 'eat2':
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.05);
                    osc.frequency.setValueAtTime(1046.5, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'eat3':
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(987.77, audioCtx.currentTime + 0.05);
                    osc.frequency.setValueAtTime(1174.66, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.2);
                    break;
                case 'die':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.5);
                    break;
                case 'pause':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'turn':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.05);
                    break;
            }
        }

        // 粒子系统
        function createParticle(x, y, color) {
            const particle = {
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                life: 1.0,
                decay: 0.02 + Math.random() * 0.02,
                size: 2 + Math.random() * 3,
                color: color
            };
            gameState.particles.push(particle);
        }

        function updateParticles() {
            for (let i = gameState.particles.length - 1; i >= 0; i--) {
                const p = gameState.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                p.size *= 0.97;
                if (p.life <= 0) {
                    gameState.particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            gameState.particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        // 食物系统
        function spawnFood() {
            gameState.food.x = Math.floor(Math.random() * gameState.gridSize);
            gameState.food.y = Math.floor(Math.random() * gameState.gridSize);
        }

        // 绘制网格
        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= gameState.gridSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gameState.cellSize, 0);
                ctx.lineTo(i * gameState.cellSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * gameState.cellSize);
                ctx.lineTo(canvas.width, i * gameState.cellSize);
                ctx.stroke();
            }
        }

        // 绘制蛇
        function drawSnake() {
            const snake = gameState.snake;
            for (let i = snake.length - 1; i >= 0; i--) {
                const segment = snake[i];
                const x = segment.x * gameState.cellSize;
                const y = segment.y * gameState.cellSize;
                
                // 蛇头
                if (i === snake.length - 1) {
                    const gradient = ctx.createRadialGradient(
                        x + gameState.cellSize / 2, 
                        y + gameState.cellSize / 2, 
                        0,
                        x + gameState.cellSize / 2, 
                        y + gameState.cellSize / 2, 
                        gameState.cellSize / 2
                    );
                    gradient.addColorStop(0, '#00ff88');
                    gradient.addColorStop(1, '#00cc6a');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.roundRect(x + 1, y + 1, gameState.cellSize - 2, gameState.cellSize - 2, 5);
                    ctx.fill();

                    // 眼睛
                    ctx.fillStyle = '#000';
                    const eyeSize = 3;
                    const eyeOffset = 4;
                    const dir = gameState.direction;
                    let eye1x, eye1y, eye2x, eye2y;
                    
                    if (dir === 'right') {
                        eye1x = x + gameState.cellSize - eyeOffset;
                        eye1y = y + eyeOffset;
                        eye2x = x + gameState.cellSize - eyeOffset;
                        eye2y = y + gameState.cellSize - eyeOffset;
                    } else if (dir === 'left') {
                        eye1x = x + 4;
                        eye1y = y + eyeOffset;
                        eye2x = x + 4;
                        eye2y = y + gameState.cellSize - eyeOffset;
                    } else if (dir === 'up') {
                        eye1x = x + eyeOffset;
                        eye1y = y + 4;
                        eye2x = x + gameState.cellSize - eyeOffset;
                        eye2y = y + 4;
                    } else {
                        eye1x = x + eyeOffset;
                        eye1y = y + gameState.cellSize - eyeOffset;
                        eye2x = x + eyeOffset;
                        eye2y = y + gameState.cellSize - eyeOffset;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(eye1x, eye1y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eye2x, eye2y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // 蛇身
                    const t = 1 - (i / snake.length);
                    const green = Math.floor(150 + t * 105);
                    const blue = Math.floor(100 + t * 55);
                    ctx.fillStyle = `rgb(0, ${green}, ${blue})`;
                    ctx.beginPath();
                    ctx.roundRect(x + 1, y + 1, gameState.cellSize - 2, gameState.cellSize - 2, 4);
                    ctx.fill();
                    
                    // 蛇身条纹
                    if (i > 0 && i < snake.length - 1) {
                        ctx.fillStyle = 'rgba(0, 255, 136, 0.3)';
                        ctx.fillRect(x + 2, y + 2, gameState.cellSize - 4, gameState.cellSize - 4);
                    }
                }
            }
        }

        // 绘制食物
        function drawFood() {
            const food = gameState.food;
            const x = food.x * gameState.cellSize;
            const y = food.y * gameState.cellSize;
            const size = gameState.cellSize - 4;
            
            // 食物脉冲动画
            const pulse = 1 + Math.sin(gameState.foodPulse * 0.1) * 0.1;
            const r = size * pulse;
            
            // 食物发光
            const gradient = ctx.createRadialGradient(
                x + gameState.cellSize / 2, 
                y + gameState.cellSize / 2, 
                0,
                x + gameState.cellSize / 2, 
                y + gameState.cellSize / 2, 
                r
            );
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(0.5, '#ee5a24');
            gradient.addColorStop(1, 'rgba(238, 90, 36, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(x + gameState.cellSize / 2, y + gameState.cellSize / 2, r, 0, Math.PI * 2);
            ctx.fill();

            // 食物核心
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(x + gameState.cellSize / 2, y + gameState.cellSize / 2, r * 0.55, 0, Math.PI * 2);
            ctx.fill();

            // 食物高光
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(x + gameState.cellSize / 2 - 2, y + gameState.cellSize / 2 - 2, r * 0.2, 0, Math.PI * 2);
            ctx.fill();
        }

        // 绘制轨迹
        function drawTrail() {
            if (gameState.trail.length > 1) {
                ctx.strokeStyle = 'rgba(0, 255, 136, 0.1)';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(gameState.trail[0].x * gameState.cellSize + gameState.cellSize / 2, 
                          gameState.trail[0].y * gameState.cellSize + gameState.cellSize / 2);
                for (let i = 1; i < gameState.trail.length; i++) {
                    ctx.lineTo(gameState.trail[i].x * gameState.cellSize + gameState.cellSize / 2, 
                              gameState.trail[i].y * gameState.cellSize + gameState.cellSize / 2);
                }
                ctx.stroke();
            }
        }

        // 绘制分数动画
        function drawScoreAnimation() {
            // 分数飘字效果
            if (gameState.score > 0) {
                const x = gameState.snake[0].x * gameState.cellSize + gameState.cellSize / 2;
                const y = gameState.snake[0].y * gameState.cellSize - 10;
                
                ctx.fillStyle = 'rgba(0, 255, 136, 0.8)';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`+${gameState.score}`, x, y);
            }
        }

        // 游戏逻辑更新
        function updateGame() {
            gameState.direction = gameState.nextDirection;
            const head = gameState.snake[0];
            let newHead = { x: head.x, y: head.y };

            switch (gameState.direction) {
                case 'up':
                    newHead.y = (head.y - 1 + gameState.gridSize) % gameState.gridSize;
                    break;
                case 'down':
                    newHead.y = (head.y + 1) % gameState.gridSize;
                    break;
                case 'left':
                    newHead.x = (head.x - 1 + gameState.gridSize) % gameState.gridSize;
                    break;
                case 'right':
                    newHead.x = (head.x + 1) % gameState.gridSize;
                    break;
            }

            // 碰撞检测 - 墙壁
            if (newHead.x < 0 || newHead.x >= gameState.gridSize || 
                newHead.y < 0 || newHead.y >= gameState.gridSize) {
                gameOver('撞墙了！');
                return;
            }

            // 碰撞检测 - 自身
            for (let i = 0; i < gameState.snake.length; i++) {
                if (gameState.snake[i].x === newHead.x && gameState.snake[i].y === newHead.y) {
                    gameOver('咬到自己了！');
                    return;
                }
            }

            // 移动蛇
            gameState.snake.unshift(newHead);

            // 检测食物
            if (newHead.x === gameState.food.x && newHead.y === gameState.food.y) {
                gameState.score += 10;
                playSound('eat');
                
                // 食物粒子效果
                for (let i = 0; i < 10; i++) {
                    createParticle(
                        newHead.x * gameState.cellSize + gameState.cellSize / 2,
                        newHead.y * gameState.cellSize + gameState.cellSize / 2,
                        '#ff6b6b'
                    );
                }

                // 加速
                gameState.gameSpeed = Math.max(60, gameState.gameSpeed - 2);
                clearInterval(gameState.gameLoop);
                gameState.gameLoop = setInterval(gameLoopTick, gameState.gameSpeed);
                
                // 更新最高分
                if (gameState.score > gameState.bestScore) {
                    gameState.bestScore = gameState.score;
                    localStorage.setItem('snakeBestScore', gameState.bestScore);
                    bestScoreEl.textContent = gameState.bestScore;
                    newBestMsg.style.display = 'block';
                    setTimeout(() => newBestMsg.style.display = 'none', 3000);
                }

                // 随机新食物
                spawnFood();
            } else {
                // 移除尾部
                gameState.snake.pop();
            }

            // 记录轨迹
            gameState.trail.unshift({ x: newHead.x, y: newHead.y });
            if (gameState.trail.length > 30) gameState.trail.pop();
        }

        // 游戏主循环
        function gameLoopTick() {
            if (!gameState.isRunning || gameState.isPaused || gameState.isGameOver) return;
            updateGame();
            render();
        }

        // 渲染
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 背景
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 网格
            drawGrid();
            
            // 轨迹
            drawTrail();
            
            // 食物
            drawFood();
            
            // 蛇
            drawSnake();
            
            // 粒子
            drawParticles();
            
            // 分数动画
            drawScoreAnimation();
        }

        // 游戏结束
        function gameOver(reason) {
            gameState.isGameOver = true;
            gameState.isRunning = false;
            clearInterval(gameState.gameLoop);
            
            playSound('die');
            
            // 更新最高分
            if (gameState.score > gameState.bestScore) {
                gameState.bestScore = gameState.score;
                localStorage.setItem('snakeBestScore', gameState.bestScore);
                bestScoreEl.textContent = gameState.bestScore;
                newBestMsgOver.style.display = 'block';
                setTimeout(() => newBestMsgOver.style.display = 'none', 3000);
            }
            
            // 显示游戏结束界面
            finalScoreEl.textContent = gameState.score;
            gameOverReasonEl.textContent = reason;
            gameOverScreen.classList.add('active');
            startScreen.classList.remove('active');
        }

        // 开始游戏
        function startGame() {
            initAudio();
            gameState.snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            gameState.direction = 'right';
            gameState.nextDirection = 'right';
            gameState.score = 0;
            gameState.gameSpeed = 120;
            gameState.isRunning = true;
            gameState.isPaused = false;
            gameState.isGameOver = false;
            gameState.particles = [];
            gameState.trail = [];
            gameState.foodPulse = 0;
            
            spawnFood();
            scoreEl.textContent = '0';
            newBestMsg.style.display = 'none';
            newBestMsgOver.style.display = 'none';
            
            startScreen.classList.remove('active');
            gameOverScreen.classList.remove('active');
            
            // 启动游戏循环
            clearInterval(gameState.gameLoop);
            gameState.gameLoop = setInterval(gameLoopTick, gameState.gameSpeed);
        }

        // 暂停/继续
        function togglePause() {
            if (gameState.isGameOver) return;
            gameState.isPaused = !gameState.isPaused;
            
            if (gameState.isPaused) {
                playSound('pause');
                clearInterval(gameState.gameLoop);
                gameOverScreen.classList.remove('active');
                gameOverScreen.classList.add('active');
                pauseBtn.textContent = '▶';
            } else {
                gameState.gameLoop = setInterval(gameLoopTick, gameState.gameSpeed);
                gameOverScreen.classList.remove('active');
                startScreen.classList.remove('active');
                pauseBtn.textContent = '⏸';
            }
        }

        // 键盘控制
        const keyMap = {
            'ArrowUp': 'up', 'w': 'up', 'W': 'up',
            'ArrowDown': 'down', 's': 'down', 'S': 'down',
            'ArrowLeft': 'left', 'a': 'left', 'A': 'left',
            'ArrowRight': 'right', 'd': 'right', 'D': 'right'
        };

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            
            // 暂停/继续
            if (key === 'p' || key === 'P') {
                if (gameState.isRunning && !gameState.isGameOver) {
                    togglePause();
                }
                return;
            }
            
            // 空格暂停
            if (key === ' ') {
                e.preventDefault();
                if (gameState.isRunning && !gameState.isGameOver) {
                    togglePause();
                }
                return;
            }

            // 方向控制
            if (keyMap[key] && gameState.isRunning && !gameState.isGameOver && !gameState.isPaused) {
                const dir = keyMap[key];
                if (dir !== gameState.direction && 
                    dir !== gameState.nextDirection) {
                    gameState.nextDirection = dir;
                    playSound('turn');
                }
                e.preventDefault();
            }
        });

        // 触摸控制
        let touchStartX = 0, touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
        });

        canvas.addEventListener('touchend', (e) => {
            const touch = e.changedTouches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && gameState.direction !== 'left' && 
                    gameState.direction !== 'right') {
                    gameState.nextDirection = 'right';
                    playSound('turn');
                } else if (dx < 0 && gameState.direction !== 'right' && 
                           gameState.direction !== 'left') {
                    gameState.nextDirection = 'left';
                    playSound('turn');
                }
            } else {
                if (dy > 0 && gameState.direction !== 'up' && 
                    gameState.direction !== 'down') {
                    gameState.nextDirection = 'down';
                    playSound('turn');
                } else if (dy < 0 && gameState.direction !== 'down' && 
                           gameState.direction !== 'up') {
                    gameState.nextDirection = 'up';
                    playSound('turn');
                }
            }
        });

        // 按钮事件
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        menuBtn.addEventListener('click', () => {
            gameState.isRunning = false;
            gameState.isGameOver = false;
            clearInterval(gameState.gameLoop);
            startScreen.classList.add('active');
            gameOverScreen.classList.remove('active');
        });
        pauseBtn.addEventListener('click', togglePause);

        // 初始化
        bestScoreEl.textContent = gameState.bestScore;
        spawnFood();
        render();

        // 初始教程提示
        setTimeout(() => {
            tutorial.classList.add('show');
            setTimeout(() => tutorial.classList.remove('show'), 4000);
        }, 500);
    </script>
</body>
</html>
