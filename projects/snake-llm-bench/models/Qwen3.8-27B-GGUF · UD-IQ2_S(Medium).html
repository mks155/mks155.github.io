<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    user-select: none;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #00f5a0, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }

  .info-bar {
    display: flex;
    gap: 30px;
    margin-bottom: 15px;
    font-size: 1.1rem;
  }

  .info-bar span {
    background: #16213e;
    padding: 8px 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 245, 160, 0.15);
  }

  .info-bar b { color: #00f5a0; }

  canvas {
    border: 3px solid #0f3460;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
    background: #0f0f23;
  }

  .controls {
    margin-top: 15px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .controls span {
    background: #16213e;
    padding: 4px 12px;
    border-radius: 5px;
    font-size: 0.85rem;
    color: #aaa;
  }

  /* 覆盖层 */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.75);
    z-index: 10;
  }

  .overlay.hidden { display: none; }

  .panel {
    background: #16213e;
    border: 2px solid #00f5a0;
    border-radius: 16px;
    padding: 40px 60px;
    text-align: center;
    box-shadow: 0 0 40px rgba(0,245,160,0.3);
    animation: pop 0.3s ease;
  }

  @keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .panel h2 { font-size: 2rem; margin-bottom: 15px; color: #00f5a0; }
  .panel p { font-size: 1.2rem; margin-bottom: 20px; color: #ccc; }

  .btn {
    background: linear-gradient(135deg, #00f5a0, #00d4ff);
    border: none;
    padding: 12px 36px;
    font-size: 1.1rem;
    font-weight: bold;
    color: #0f0f23;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,245,160,0.4);
  }

  /* 移动端方向键 */
  .dpad {
    display: none;
    margin-top: 18px;
    grid-template-columns: repeat(3, 60px);
    gap: 6px;
    justify-content: center;
  }

  .dpad button {
    width: 60px; height: 50px;
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 8px;
    color: #00f5a0;
    font-size: 1.4rem;
    cursor: pointer;
  }

  @media (max-width: 700px) {
    h1 { font-size: 1.6rem; }
    canvas { width: 95vw !important; height: auto; }
    .dpad { display: grid; }
    .controls { display: none; }
  }
</style>
</head>
<body>

<h1>🐍 贪吃蛇</h1>
<div class="info-bar">
  <span>得分：<b id="score">0</b></span>
  <span>最高分：<b id="highScore">0</b></span>
  <span>长度：<b id="length">3</b></span>
</div>

<canvas id="game" width="400" height="400"></canvas>

<div class="controls">
  <span>⬆️⬇️⬅️➡️ 方向键 / WASD 移动</span>
  <span>空格暂停</span>
  <span>R 重新开始</span>
</div>

<!-- 移动端方向键 -->
<div class="dpad">
  <button style="visibility:hidden"></button>
  <button onclick="setDir(0,-1)">▲</button>
  <button style="visibility:hidden"></button>
  <button onclick="setDir(-1,0)">◀</button>
  <button onclick="togglePause()">⏸</button>
  <button onclick="setDir(1,0)">▶</button>
  <button style="visibility:hidden"></button>
  <button onclick="setDir(0,1)">▼</button>
  <button style="visibility:hidden"></button>
</div>

<!-- 开始面板 -->
<div class="overlay" id="startOverlay">
  <div class="panel">
    <h2>🐍 贪吃蛇</h2>
    <p>用方向键或 WASD 控制蛇的方向<br>吃到食物增长，别撞墙和自己的身体！</p>
    <button class="btn" onclick="startGame()">开始游戏</button>
  </div>
</div>

<!-- 结束面板 -->
<div class="overlay hidden" id="endOverlay">
  <div class="panel">
    <h2>💀 游戏结束</h2>
    <p id="finalScore">最终得分：0</p>
    <button class="btn" onclick="startGame()">再来一局</button>
  </div>
</div>

<script>
// ===== 常量 =====
const COLS = 20, ROWS = 20;
const CELL = document.getElementById('game').width / COLS; // 20px
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ===== 状态 =====
let snake, food, dir, nextDir, score, highScore = 0, speed, paused, gameOver, animId;

function init() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1, y:0};
  nextDir = {x:1, y:0};
  score = 0;
  speed = 150; // ms
  paused = false;
  gameOver = false;
  placeFood();
  updateUI();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
  } while (snake.some(s => s.x===food.x && s.y===food.y));
}

// ===== 绘制 =====
function draw() {
  // 背景 + 网格
  ctx.fillStyle = '#0f0f23';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();}
  for (let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke();}

  // 食物（脉冲效果）
  const pulse = 0.85 + 0.15 * Math.sin(Date.now()/200);
  ctx.save();
  ctx.translate(food.x*CELL+CELL/2, food.y*CELL+CELL/2);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = '#ff4757';
  ctx.shadowColor = '#ff4757';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(0, 0, CELL*0.38, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // 蛇
  snake.forEach((seg, i) => {
    const t = i / snake.length;
    const r = Math.round(0 + t * 60);
    const g = Math.round(245 - t * 100);
    const b = Math.round(160 - t * 40);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    if (i === 0) { ctx.shadowColor = '#00f5a0'; ctx.shadowBlur = 14; } else { ctx.shadowBlur = 0; }
    roundRect(ctx, seg.x*CELL+1, seg.y*CELL+1, CELL-2, CELL-2, 5);
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  // 蛇眼
  const head = snake[0];
  const ex = head.x*CELL + CELL/2, ey = head.y*CELL + CELL/2;
  const eyeOff = 5;
  let e1x, e1y, e2x, e2y;
  if (dir.x===1){e1x=ex+eyeOff-3;e1y=ey-4;e2x=e1x;e2y=ey+4;}
  else if(dir.x===-1){e1x=ex-eyeOff+3;e1y=ey-4;e2x=e1x;e2y=ey+4;}
  else if(dir.y===-1){e1x=ex-4;e1y=ey-eyeOff+3;e2x=ex+4;e2y=e1y;}
  else{e1x=ex-4;e1y=ey+eyeOff-3;e2x=ex+4;e2y=e1y;}
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(e1x,e1y,2.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(e2x,e2y,2.5,0,Math.PI*2);ctx.fill();

  // 暂停遮罩
  if (paused && !gameOver) {
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#00f5a0';
    ctx.font='bold 28px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('⏸ 暂停', canvas.width/2, canvas.height/2);
  }
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}

// ===== 游戏循环 =====
function tick() {
  if (gameOver || paused) return;

  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // 撞墙
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return endGame();

  // 撞自己（尾巴即将移除，所以排除最后一节）
  if (snake.slice(0, -1).some(s => s.x===head.x && s.y===head.y)) return endGame();

  snake.unshift(head);

  // 吃食物
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    speed = Math.max(60, speed - 4);
    placeFood();
    updateUI();
  } else {
    snake.pop();
  }

  draw();
}

function loop() {
  animId = setTimeout(() => { tick(); requestAnimationFrame(loop); }, speed);
}

// ===== 控制 =====
function setDir(x, y) {
  if (x === -dir.x && y === -dir.y) return; // 不能180°掉头
  nextDir = { x, y };
}

function togglePause() {
  if (gameOver) return;
  paused = !paused;
  draw();
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup'    || k === 'w') setDir(0,-1);
  else if (k === 'arrowdown'  || k === 's') setDir(0,1);
  else if (k === 'arrowleft'  || k === 'a') setDir(-1,0);
  else if (k === 'arrowright' || k === 'd') setDir(1,0);
  else if (k === ' ') { e.preventDefault(); togglePause(); }
  else if (k === 'r') startGame();
});

// ===== UI =====
function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('length').textContent = snake.length;
  if (score > highScore) {
    highScore = score;
    document.getElementById('highScore').textContent = highScore;
  }
}

// ===== 生命周期 =====
function startGame() {
  clearTimeout(animId);
  init();
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('endOverlay').classList.add('hidden');
  draw();
  loop();
}

function endGame() {
  gameOver = true;
  clearTimeout(animId);
  if (score > highScore) highScore = score;
  document.getElementById('highScore').textContent = highScore;
  document.getElementById('finalScore').textContent = `最终得分：${score} ｜ 蛇长：${snake.length}`;
  document.getElementById('endOverlay').classList.remove('hidden');
}

// 初始画面
init();
draw();
</script>
</body>
</html>
