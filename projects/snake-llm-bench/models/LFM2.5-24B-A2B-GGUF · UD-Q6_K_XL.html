<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-info {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .game-info span {
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        #score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d4ff;
        }

        #high-score {
            font-size: 1rem;
            color: #ffd700;
        }

        #canvas-container {
            position: relative;
            border: 4px solid #00d4ff;
            border-radius: 10px;
            background: #0a0a0a;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        #gameCanvas {
            display: block;
            background: #0a0a0a;
        }

        .controls {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            max-width: 400px;
            width: 100%;
        }

        .controls h3 {
            margin-bottom: 10px;
            color: #7b2cbf;
        }

        .controls p {
            font-size: 0.9rem;
            color: #aaa;
        }

        .key {
            background: #1a1a2e;
            padding: 2px 8px;
            border-radius: 4px;
            margin: 0 2px;
            color: #00d4ff;
            font-family: monospace;
        }

        .instructions {
            margin-top: 15px;
            color: #888;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <h1>🐍 贪吃蛇游戏</h1>
    
    <div class="game-info">
        <span>得分: <span id="score">0</span></span>
        <span>最高分: <span id="high-score">0</span></span>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <h3>操作说明</h3>
        <p>使用 <span class="key">↑</span> <span class="key">↓</span> <span class="key">←</span> <span class="key">→</span> 或 <a href="#" id="pauseBtn">空格键</a> 控制方向</p>
        <p>吃到食物即可变长，避免撞到自己或墙壁</p>
    </div>

    <div class="instructions">
        <p>💡 提示：按 <span class="key">P</span> 暂停游戏</p>
    </div>

    <script>
        // 游戏配置
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');

        // 游戏参数
        const GRID_SIZE = 20;  // 每个格子的大小
        const TILE_COUNT = canvas.width / GRID_SIZE;  // 20x20 的网格

        // 游戏状态
        let snake = [];
        let food = { x: 0, y: 0 };
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = true;
        let gamePaused = false;
        let gameSpeed = 100;  // 毫秒/帧

        // 初始化游戏
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameRunning = true;
            gamePaused = false;
            updateScore();
            spawnFood();
        }

        // 生成食物
        function spawnFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);
                validPosition = !isOnSnake(food.x, food.y);
            }
        }

        // 检查食物是否在蛇身上
        function isOnSnake(x, y) {
            return snake.some(segment => segment.x === x && segment.y === y);
        }

        // 更新分数显示
        function updateScore() {
            scoreElement.textContent = score;
            highScoreElement.textContent = highScore;
        }

        // 绘制游戏
        function draw() {
            // 清除画布
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制网格（可选）
            drawGrid();

            // 绘制食物
            drawFood();

            // 绘制蛇
            drawSnake();
        }

        // 绘制网格线
        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }
        }

        // 绘制食物
        function drawFood() {
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // 食物高光
            ctx.fillStyle = '#ff6b81';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2 - 2,
                food.y * GRID_SIZE + GRID_SIZE / 2 - 2,
                GRID_SIZE / 4,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        // 绘制蛇
        function drawSnake() {
            snake.forEach((segment, index) => {
                // 蛇身体颜色渐变
                const hue = (index / snake.length) * 60;  // 蓝色到红色
                ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
                
                // 画矩形
                const x = segment.x * GRID_SIZE;
                const y = segment.y * GRID_SIZE;
                const size = GRID_SIZE - 2;
                
                ctx.fillRect(x + 1, y + 1, size, size);
                
                // 蛇头眼睛
                if (index === 0) {
                    ctx.fillStyle = '#0a0a0a';
                    if (direction.x === 1) {
                        ctx.fillRect(x + size - 4, y + 4, 3, 3);
                        ctx.fillRect(x + size - 4, y + size - 7, 3, 3);
                    } else if (direction.x === -1) {
                        ctx.fillRect(x + 4, y + 4, 3, 3);
                        ctx.fillRect(x + 4, y + size - 7, 3, 3);
                    } else if (direction.y === 1) {
                        ctx.fillRect(x + 4, y + size - 7, 3, 3);
                        ctx.fillRect(x + size - 7, y + size - 7, 3, 3);
                    } else {
                        ctx.fillRect(x + 4, y + 4, 3, 3);
                        ctx.fillRect(x + size - 7, y + 4, 3, 3);
                    }
                }
            });
        }

        // 游戏循环
        function gameLoop() {
            if (!gameRunning || gamePaused) return;

            // 更新方向（防止连续反向移动）
            if (direction.x !== nextDirection.x || direction.y !== nextDirection.y) {
                direction = nextDirection;
            }

            // 计算新头部位置
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // 碰撞检测：墙壁
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // 碰撞检测：自身
            if (isOnSnake(head.x, head.y)) {
                gameOver();
                return;
            }

            // 添加新头部
            snake.unshift(head);

            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                spawnFood();
                // 加快游戏速度
                if (gameSpeed > 50) {
                    gameSpeed -= 2;
                }
            } else {
                // 移除尾巴（保持长度）
                snake.pop();
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            
            // 更新最高分
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                updateScore();
            }

            // 显示游戏结束信息
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff4757';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束!', canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillStyle = '#fff';
            ctx.font = '16px Arial';
            ctx.fillText(`最终得分: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
            ctx.fillText(`最高分: ${highScore}`, canvas.width / 2, canvas.height / 2 + 35);
        }

        // 暂停/继续游戏
        function togglePause() {
            gamePaused = !gamePaused;
            if (gamePaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('⏸ 暂停', canvas.width / 2, canvas.height / 2);
            } else {
                draw();
            }
        }

        // 事件监听
        document.addEventListener('keydown', (e) => {
            if (e.key === 'p' || e.key === 'P') {
                togglePause();
            }
        });

        document.getElementById('pauseBtn').addEventListener('click', togglePause);

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                    if (direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    }
                    break;
                case 'ArrowDown':
                    if (direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    }
                    break;
                case 'ArrowLeft':
                    if (direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    }
                    break;
                case 'ArrowRight':
                    if (direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    }
                    break;
            }
        });

        // 启动游戏
        initGame();
        gameLoop();
    </script>
</body>
</html>
