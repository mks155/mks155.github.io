<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            color: white;
        }
        canvas {
            border: 3px solid #4CAF50;
            background-color: #000;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }
        .info {
            margin-top: 20px;
            font-size: 24px;
            text-align: center;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>贪吃蛇游戏</h1>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="info">得分: <span id="score">0</span></div>
    <div class="game-over" id="gameOver">
        <h2>游戏结束！</h2>
        <p>您的得分: <span id="finalScore">0</span></p>
        <button onclick="location.reload()">重新开始</button>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');

        // 游戏状态
        let snake = [{x: 20, y: 20}]; // 蛇身体（坐标数组）
        let food = {x: 40, y: 40};    // 食物位置
        let direction = 'right';     // 当前方向
        let nextDirection = 'right'; // 下一步方向（防止反向）
        let score = 0;
        let gameOver = false;
        const gridSize = 20; // 每个格子大小
        const speed = 100;   // 移动速度（毫秒）

        // 初始化游戏
        function init() {
            generateFood();
            updateScore(0);
            gameOver = false;
            gameOverElement.style.display = 'none';
            snake = [{x: 20, y: 20}];
            direction = 'right';
            nextDirection = 'right';
        }

        // 生成随机食物
        function generateFood() {
            food.x = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
            food.y = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
            // 确保食物不在蛇身上
            if (snake.some(segment => segment.x === food.x && segment.y === food.y)) {
                generateFood();
            }
        }

        // 移动蛇
        function moveSnake() {
            if (gameOver) return;

            // 更新方向（防止反向移动）
            direction = nextDirection;

            // 计算新头部位置
            const head = {x: snake[0].x, y: snake[0].y};
            switch (direction) {
                case 'up': head.y -= gridSize; break;
                case 'down': head.y += gridSize; break;
                case 'left': head.x -= gridSize; break;
                case 'right': head.x += gridSize; break;
            }

            // 检查碰撞边界
            if (
                head.x < 0 || 
                head.x >= canvas.width / gridSize || 
                head.y < 0 || 
                head.y >= canvas.height / gridSize
            ) {
                endGame();
                return;
            }

            // 检查碰撞自身
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            // 添加新头部
            snake.unshift(head);

            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score++;
                updateScore(score);
                generateFood();
            } else {
                snake.pop(); // 否则移除尾部
            }

            draw();
        }

        // 绘制游戏画面
        function draw() {
            // 清空画布
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制蛇身体
            ctx.fillStyle = '#00FF00';
            snake.forEach((segment, index) => {
                // 头部 brighter
                if (index === 0) {
                    ctx.fillStyle = '#32CD32';
                } else {
                    ctx.fillStyle = '#00FF00';
                }
                ctx.fillRect(segment.x, segment.y, gridSize - 2, gridSize - 2);
            });

            // 绘制食物
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(food.x, food.y, gridSize - 2, gridSize - 2);
        }

        // 结束游戏
        function endGame() {
            gameOver = true;
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
            clearInterval(gameInterval);
        }

        // 更新分数显示
        function updateScore(newScore) {
            score = newScore;
            scoreElement.textContent = score;
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                    if (direction !== 'down') nextDirection = 'up';
                    break;
                case 'ArrowDown':
                    if (direction !== 'up') nextDirection = 'down';
                    break;
                case 'ArrowLeft':
                    if (direction !== 'right') nextDirection = 'left';
                    break;
                case 'ArrowRight':
                    if (direction !== 'left') nextDirection = 'right';
                    break;
            }
        });

        // 初始化并开始游戏
        init();
        draw();
        const gameInterval = setInterval(moveSnake, speed);
    </script>
    <script>
        // 页面加载时自动开始游戏
        window.onload = () => {
            // 确保有初始游戏状态
            document.getElementById('game').onclick = () => {
                if (!gameOver) return;
                init();
                const gameInterval = setInterval(moveSnake, speed);
                window.gameInterval = gameInterval; // 保留引用用于重置
            };
        };
    </script>
</body>
</html>
