<html lang="zh-CN"> <head> <meta charset="UTF-8"> <title>Snake 游戏</title> <style> body { margin: 0; background: #2c3e50; color: #ecf0f1; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; } #game { text-align: center; margin-top: 20px; } canvas { border: 5px solid #34495e; background: #556b2f; box-shadow: 0 0 10px rgba(0,0,0,0.5); } #instructions { margin-bottom: 10px; font-size: 14px; color: #7f8c8d; } </style> </head> <body> <div id="game"> <h1>贪吃蛇</h1> <canvas id="snakeCanvas" width="400" height="300"></canvas> <div id="instructions">向下移动即前进，键箭头或ROP 删除方块</div> </div>

<script>
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');
    const instructions = document.getElementById('instructions');

    const cellSize = 20; // 每格像素大小
    const gridWidth = canvas.width / cellSize;
    const gridHeight = canvas.height / cellSize;
    const foodSize = 24;

    let snake = [];
    let food = [];
    let direction = { x: 0, y: 1 };
    let score = 0;
    let gameOver = false;
    let gameSpeed = 150; // 帧率

    // 初始化蛇和食物
    function init() {
        snake.length = 3;
        for (let i = 0; i < 3; i++) {
            snake.push({ x: Math.floor(Math.random() * gridWidth), y: 0 });
        }
        spawnFood();
    }

    function spawnFood() {
        let x, y;
        do {
            x = Math.floor(Math.random() * gridWidth);
            y = Math.floor(Math.random() * gridHeight);
        } while ((x, y) === snake[0]);
        food = [{ x, y }];
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // 画食物
        drawSquare(food[0].x, food[0].y, foodSize, '#ff9800');
        // 画蛇
        for (let i = 0; i < snake.length; i++) {
            drawSquare(snake[i].x, snake[i].y, cellSize, '#27ae60');
        }
    }

    function drawSquare(x, y, w, c) {
        ctx.fillStyle = c;
        ctx.fillRect(x * cellSize, y * cellSize, w, w);
        ctx.strokeStyle = '#ecf0f1';
        ctx.lineWidth = 2;
        ctx.strokeRect(x * cellSize, y * cellSize, w, w);
    }

    function update() {
        if (gameOver) return;

        // 移动蛇头
        let head = snake[0];
        switch (direction) {
            case 'up': head.y -= cellSize; break;
            case 'down': head.y += cellSize; break;
            case 'left': head.x -= cellSize; break;
            case 'right': head.x += cellSize; break;
        }

        // 检查碰撞墙
        if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight) {
            gameOver = true;
            return;
        }

        // 检查自撞
        for (let i = 1; i < snake.length; i++) {
            if (snake[i] === head) {
                gameOver = true;
                return;
            }
        }

        snake.unshift(head); // 添加新头部

        // 食物碰撞或吃完食物
        if (head === food[0]) {
            score += 20;
            drawSquare(food[0].x, food[0].y, foodSize, '#ff9800');
            spawnFood();
        } else {
            snake.pop(); // 移除尾部
        }

        draw();
    }

    function gameLoop() {
        update();
        instructions.textContent = `得分: ${score}  |  剩余生命: ${Math.ceil((snake.length * cellSize) / 3}`;

        if (!gameOver) {
            requestAnimationFrame(gameLoop);
        }
    }

    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') direction = { x: 0, y: -1 };
        else if (e.key === 'ArrowDown') direction = { x: 0, y: 1 };
        else if (e.key === 'ArrowLeft') direction = { x: -1, y: 0 };
        else if (e.key === 'ArrowRight') direction = { x: 1, y: 0 };
        else if (e.key === 'r' || e.key === 'R') direction = { x: 0, y: -1 };
    });

    init();
    gameLoop();
</script>
</body> </html>
