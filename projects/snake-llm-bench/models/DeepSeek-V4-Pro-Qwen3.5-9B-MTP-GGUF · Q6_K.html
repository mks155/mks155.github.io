<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典贪吃蛇 - Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        .game-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .score-board {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #f1c40f;
        }

        canvas {
            background-color: #000;
            border: 4px solid #3498db;
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(52, 152, 219, 0.3);
            display: block;
            margin: 0 auto;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background-color: #e74c3c;
            color: white;
            transition: transform 0.2s, background-color 0.2s;
            font-weight: bold;
        }

        button:hover {
            background-color: #c0392b;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🐍 贪吃蛇</h1>
    <div class="score-board">得分：<span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="controls">
        <button onclick="startGame()">重新开始</button>
    </div>
    
    <p class="instructions">使用 ⬆️⬇️⬅️➡️ 方向键控制移动</p>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    // 游戏配置
    const gridSize = 20; // 每个格子的大小
    const tileCount = canvas.width / gridSize; // 一行有多少个格子
    
    let velocityX = 0;
    let velocityY = 0;
    let snake = [];
    let food = { x: 5, y: 5 };
    let score = 0;
    let gameInterval;
    let isGameRunning = false;

    // 初始化游戏
    function startGame() {
        if (isGameRunning) return;
        
        // 重置状态
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }]; // 初始蛇身长度 3
        velocityX = 1; // 默认向右移动
        velocityY = 0;
        score = 0;
        scoreElement.innerText = score;
        isGameRunning = true;

        placeFood();
        
        // 清除之前的定时器并开始新循环
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, 100); // 游戏速度：100ms 刷新一次（可调整）
    }

    function gameLoop() {
        update();
        draw();
    }

    // 更新游戏逻辑
    function update() {
        // 计算新的蛇头位置
        const head = { x: snake[0].x + velocityX, y: snake[0].y + velocityY };

        // 1. 撞墙检测
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            gameOver();
            return;
        }

        // 2. 撞自己检测
        for (let i = 0; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                gameOver();
                return;
            }
        }

        // 将新头加入数组最前面
        snake.unshift(head);

        // 3. 吃食物检测
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreElement.innerText = score;
            placeFood();
            // 吃到食物时不移除尾部，实现变长
        } else {
            // 没吃到食物，移除尾部，保持长度不变
            snake.pop();
        }
    }

    // 绘制画面
    function draw() {
        // 清空画布
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 绘制蛇
        snake.forEach((part, index) => {
            // 蛇头颜色稍亮，身体渐暗
            if (index === 0) {
                ctx.fillStyle = '#2ecc71'; // 亮绿色
            } else {
                ctx.fillStyle = '#27ae60'; // 深绿色
            }
            
            // 绘制矩形时留一点间隙，看起来更像格子
            ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
        });

        // 绘制食物
        ctx.fillStyle = '#e74c3c'; // 红色食物
        ctx.beginPath();
        // 画一个圆形的食物
        ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
        ctx.fill();
    }

    // 随机放置食物，确保不生成在蛇身上
    function placeFood() {
        let validPosition = false;
        while (!validPosition) {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            validPosition = true;
            // 检查是否生成在蛇身上
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    validPosition = false;
                    break;
                }
            }
        }
    }

    function gameOver() {
        isGameRunning = false;
        clearInterval(gameInterval);
        
        // 绘制游戏结束文字
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = 'white';
        ctx.font = 'bold 40px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('游戏结束!', canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.font = '20px Arial';
        ctx.fillText(`最终得分：${score}`, canvas.width / 2, canvas.height / 2 + 20);
    }

    // 键盘监听
    document.addEventListener('keydown', keyDownEvent);

    function keyDownEvent(event) {
        if (!isGameRunning) return;

        // 防止按键导致页面滚动
        if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(event.code) > -1) {
            event.preventDefault();
        }

        switch (event.keyCode) {
            case 37: // Left
                if (velocityX !== 1) { // 不能直接掉头
                    velocityX = -1;
                    velocityY = 0;
                }
                break;
            case 38: // Up
                if (velocityY !== 1) {
                    velocityX = 0;
                    velocityY = -1;
                }
                break;
            case 39: // Right
                if (velocityX !== -1) {
                    velocityX = 1;
                    velocityY = 0;
                }
                break;
            case 40: // Down
                if (velocityY !== -1) {
                    velocityX = 0;
                    velocityY = 1;
                }
                break;
        }
    }

    // 页面加载完成后自动开始一次演示（可选，这里默认不自动开始，等待用户点击）
    // startGame(); 
</script>

</body>
</html>
