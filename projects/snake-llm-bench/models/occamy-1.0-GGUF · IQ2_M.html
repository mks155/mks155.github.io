<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 🐍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            text-align: center;
        }

        h1 {
            color: #00ff88;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            letter-spacing: 4px;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 400px;
            margin-bottom: 10px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .score, .high-score, .level {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .score span {
            color: #00ff88;
            font-size: 1.3rem;
        }

        .high-score span {
            color: #ffd700;
            font-size: 1.3rem;
        }

        .level {
            color: #ff6b6b;
        }

        canvas {
            border: 2px solid #00ff88;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.15),
                        inset 0 0 30px rgba(0, 0, 0, 0.3);
            background: #1a1a2e;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 24px;
            border: 2px solid #00ff88;
            border-radius: 8px;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        button:hover {
            background: rgba(0, 255, 136, 0.25);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            z-index: 10;
        }

        .overlay h2 {
            color: #ff6b6b;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        .overlay p {
            color: #ccc;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .overlay .final-score {
            color: #ffd700;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .overlay button {
            font-size: 1.1rem;
            padding: 12px 30px;
        }

        .instructions {
            color: #aaa;
            font-size: 0.85rem;
            margin-top: 10px;
            line-height: 1.6;
        }

        /* 移动端方向键 */
        .mobile-controls {
            display: none;
            margin-top: 15px;
            width: 150px;
            height: 150px;
            position: relative;
        }

        .mobile-controls .d-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 2px solid rgba(0, 255, 136, 0.5);
            border-radius: 10px;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            font-size: 1.4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.2s;
        }

        .mobile-controls .d-btn:active {
            background: rgba(0, 255, 136, 0.35);
        }

        .d-btn.up    { top: 0;   left: 50%;  transform: translateX(-50%); }
        .d-btn.down  { bottom: 0;left: 50%;  transform: translateX(-50%); }
        .d-btn.left  { left: 0;  top: 50%;   transform: translateY(-50%); }
        .d-btn.right { right: 0; top: 50%;   transform: translateY(-50%); }

        @media (max-width: 500px) {
            h1 { font-size: 1.6rem; }
            .info-bar { width: 300px; }
            canvas { width: 300px !important; height: 300px !important; }
            .mobile-controls { display: block; }
            .instructions { display: none; }
        }

        /* 食物动画 */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇</h1>
        <div class="info-bar">
            <div class="score">得分：<span id="score">0</span></div>
            <div class="level">速度：<span id="level">1</span></div>
            <div class="high-score">最高分：<span id="highScore">0</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <button id="startBtn" onclick="startGame()">开始游戏</button>
            <button id="pauseBtn" onclick="togglePause()" style="display:none;">暂停</button>
        </div>
        <div class="mobile-controls" id="mobileControls">
            <div class="d-btn up" ontouchstart="handleMobile('up')" onmousedown="handleMobile('up')">▲</div>
            <div class="d-btn down" ontouchstart="handleMobile('down')" onmousedown="handleMobile('down')">▼</div>
            <div class="d-btn left" ontouchstart="handleMobile('left')" onmousedown="handleMobile('left')">◀</div>
            <div class="d-btn right" ontouchstart="handleMobile('right')" onmousedown="handleMobile('right')">▶</div>
        </div>
        <div class="instructions">
            用 ⬆⬇⬅➡ 或 WASD 控制方向 · 吃到食物得分并变长 · 撞墙或撞到自己则游戏结束
        </div>

        <!-- 游戏结束/开始遮罩 -->
        <div class="overlay" id="overlay" style="display:none;">
            <h2 id="overlayTitle">游戏结束</h2>
            <p id="overlaySubtitle">得分：0</p>
            <div class="final-score" id="overlayScore"></div>
            <button onclick="restartGame()">再来一局</button>
        </div>
    </div>

    <script>
        // ==================== 游戏配置 ====================
        const CONFIG = {
            gridSize: 20,      // 网格大小（像素）
            boardSize: 20,     // 棋盘格数 (20x20)
            initialSpeed: 150, // 初始速度（毫秒/帧）
            speedRatio: 0.9,   // 每吃一个食物的速度递减比例
            minSpeed: 60,      // 最快速度下限
        };

        // ==================== 游戏状态 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const levelEl = document.getElementById('level');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySubtitle = document.getElementById('overlaySubtitle');
        const overlayScore = document.getElementById('overlayScore');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');

        let snake, direction, nextDirection, food, specialFood, gameLoop, gameState, speed, score, highScore;
        let particles = []; // 粒子效果

        // 加载最高分
        highScore = localStorage.getItem('snakeHighScore') || 0;
        highScoreEl.textContent = highScore;

        // ==================== 初始化 ====================
        function initGame() {
            // 蛇的初始位置（中间偏左，3节）
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 }; // 初始向右移动
            nextDirection = { x: 1, y: 0 };
            score = 0;
            speed = CONFIG.initialSpeed;
            particles = [];
            levelEl.textContent = 1;
            scoreEl.textContent = 0;
            placeFood();
            specialFood = null;
        }

        // ==================== 放置食物 ====================
        function placeFood() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * CONFIG.boardSize),
                    y: Math.floor(Math.random() * CONFIG.boardSize)
                };
            } while (isOnSnake(pos) || isOnFood(pos));
            food = pos;
        }

        function placeSpecialFood() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * CONFIG.boardSize),
                    y: Math.floor(Math.random() * CONFIG.boardSize)
                };
            } while (isOnSnake(pos) || isOnFood(pos) || (pos.x === food.x && pos.y === food.y));
            specialFood = { ...pos, timer: 100, type: 'bonus' };
        }

        function isOnSnake(pos) {
            return snake.some(seg => seg.x === pos.x && seg.y === pos.y);
        }

        function isOnFood(pos) {
            // 检查是否已有食物
            // 简化：只记录 food 位置
            return false;
        }

        // ==================== 游戏主循环 ====================
        function gameUpdate() {
            // 移动方向
            direction = { ...nextDirection };

            // 计算新头部位置
            const head = { ...snake[0] };
            head.x += direction.x;
            head.y += direction.y;

            // 检查撞墙
            if (head.x < 0 || head.x >= CONFIG.boardSize || head.y < 0 || head.y >= CONFIG.boardSize) {
                gameOver();
                return;
            }

            // 检查撞自己
            if (isOnSnake(head)) {
                gameOver();
                return;
            }

            // 移动到新的位置
            snake.unshift(head);

            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                createParticles(food.x, food.y, '#00ff88');
                placeFood();

                // 检查是否生成特殊食物
                if (score % 50 === 0 && !specialFood) {
                    placeSpecialFood();
                }

                // 加速
                if (speed > CONFIG.minSpeed) {
                    speed = Math.max(CONFIG.minSpeed, speed * CONFIG.speedRatio);
                    levelEl.textContent = Math.floor((CONFIG.initialSpeed - speed) / (CONFIG.initialSpeed - CONFIG.minSpeed) * 9) + 1;
                }

                // 重新开始循环，用新的速度
                clearInterval(gameLoop);
                gameLoop = setInterval(gameUpdate, speed);
            } else {
                // 如果没有吃到食物，移除尾部
                snake.pop();
            }

            // 检查是否吃到特殊食物
            if (specialFood && head.x === specialFood.x && head.y === specialFood.y) {
                score += 50;
                scoreEl.textContent = score;
                createParticles(specialFood.x, specialFood.y, '#ffd700');
                specialFood = null;
            }

            // 更新特殊食物计时器
            if (specialFood) {
                specialFood.timer--;
                if (specialFood.timer <= 0) {
                    specialFood = null;
                }
            }

            draw();
        }

        // ==================== 绘制 ====================
        function draw() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制网格背景
            drawGrid();

            // 绘制食物
            drawFood(food.x, food.y, '#ff4444', '#ff6b6b');

            // 绘制特殊食物
            if (specialFood) {
                drawFood(specialFood.x, specialFood.y, '#ffd700', '#ffeb3b', true);
            }

            // 绘制蛇
            drawSnake();

            // 绘制粒子效果
            drawParticles();
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= CONFIG.boardSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CONFIG.gridSize, 0);
                ctx.lineTo(canvas.height, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CONFIG.gridSize);
                ctx.lineTo(canvas.width, canvas.height);
                ctx.stroke();
            }
        }

        function drawFood(x, y, color1, color2, isSpecial = false) {
            const size = CONFIG.gridSize;
            const px = x * size;
            const py = y * size;
            const centerX = px + size / 2;
            const centerY = py + size / 2;
            const radius = size / 2 - 4;

            // 发光效果
            const glow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, size);
            glow.addColorStop(0, color1);
            glow.addColorStop(0.5, color1 + '66');
            glow.addColorStop(1, 'transparent');
            ctx.fillStyle = glow;
            ctx.fillRect(px - size / 2, py - size / 2, size, size);

            // 食物本体
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(centerX - 2, centerY - 2, 0, centerX, centerY, radius);
            gradient.addColorStop(0, color2);
            gradient.addColorStop(1, color1);
            ctx.fillStyle = gradient;
            ctx.fill();

            // 特殊食物标记
            if (isSpecial) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius - 3, 0, Math.PI * 2);
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function drawSnake() {
            const size = CONFIG.gridSize;
            snake.forEach((seg, index) => {
                const px = seg.x * size;
                const py = seg.y * size;
                const padding = 2;

                // 计算颜色（从头部到尾部渐变）
                const ratio = index / snake.length;
                const r = Math.round(0 + ratio * 0);
                const g = Math.round(255 - ratio * 100);
                const b = Math.round(136 - ratio * 80);
                const color = `rgb(${r}, ${g}, ${b})`;

                // 头部用圆形，身体用圆角矩形
                if (index === 0) {
                    // 头部
                    ctx.beginPath();
                    ctx.arc(px + size / 2, py + size / 2, size / 2 - padding + 1, 0, Math.PI * 2);
                    ctx.fillStyle = '#00ff88';
                    ctx.fill();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00ff88';

                    // 眼睛
                    const eyeOffset = 4;
                    const eyeSize = 3;
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#000';
                    if (direction.x === 1) { // 向右
                        ctx.beginPath();
                        ctx.arc(px + size / 2 + 3, py + 6, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(px + size / 2 + 3, py + size - 6, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (direction.x === -1) { // 向左
                        ctx.beginPath();
                        ctx.arc(px + size / 2 - 3, py + 6, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(px + size / 2 - 3, py + size - 6, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (direction.y === -1) { // 向上
                        ctx.beginPath();
                        ctx.arc(px + 6, py + size / 2 - 3, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(px + size - 6, py + size / 2 - 3, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    } else { // 向下
                        ctx.beginPath();
                        ctx.arc(px + 6, py + size / 2 + 3, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(px + size - 6, py + size / 2 + 3, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.shadowBlur = 0;
                } else {
                    // 身体
                    ctx.beginPath();
                    ctx.roundRect(px + padding, py + padding, size - 2 * padding, size - 2 * padding, 6);
                    ctx.fillStyle = color;
                    ctx.fill();

                    // 身体高光
                    ctx.beginPath();
                    ctx.roundRect(px + padding + 2, py + padding + 2, size - 2 * padding - 4, size - 2 * padding - 4, 4);
                    ctx.fillStyle = `rgba(255, 255, 255, 0.1)`;
                    ctx.fill();
                }
            });
        }

        // ==================== 粒子效果 ====================
        function createParticles(x, y, color) {
            const px = x * CONFIG.gridSize + CONFIG.gridSize / 2;
            const py = y * CONFIG.gridSize + CONFIG.gridSize / 2;
            for (let i = 0; i < 12; i++) {
                const angle = (Math.PI * 2 * i) / 12;
                const speed = 2 + Math.random() * 3;
                particles.push({
                    x: px,
                    y: py,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    color: color,
                    size: 3 + Math.random() * 3
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                p.size *= 0.97;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color + Math.floor(p.life * 255).toString(16).padStart(2, '0');
                ctx.fill();
            });
        }

        // ==================== 游戏状态管理 ====================
        function startGame() {
            if (gameState === 'playing') return;
            initGame();
            gameState = 'playing';
            startBtn.style.display = 'none';
            pauseBtn.style.display = 'inline-block';
            overlay.style.display = 'none';
            gameLoop = setInterval(gameUpdate, speed);
            draw();
        }

        function togglePause() {
            if (gameState === 'playing') {
                clearInterval(gameLoop);
                gameState = 'paused';
                pauseBtn.textContent = '继续';
            } else if (gameState === 'paused') {
                gameState = 'playing';
                gameLoop = setInterval(gameUpdate, speed);
                pauseBtn.textContent = '暂停';
            }
        }

        function gameOver() {
            clearInterval(gameLoop);
            gameState = 'gameover';

            // 更新最高分
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
            }

            // 显示游戏结束界面
            overlayTitle.textContent = '游戏结束';
            overlaySubtitle.textContent = '最终得分';
            overlayScore.textContent = `🏆 ${score} 分`;
            overlay.style.display = 'flex';

            // 闪烁效果
            overlayTitle.style.animation = 'pulse 1s infinite';
        }

        function restartGame() {
            overlay.style.display = 'none';
            startGame();
        }

        // ==================== 输入处理 ====================
        document.addEventListener('keydown', (e) => {
            if (gameState !== 'playing') return;

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    e.preventDefault();
                    break;
            }
        });

        // 移动端触控
        function handleMobile(direction) {
            if (gameState !== 'playing') return;
            switch (direction) {
                case 'up':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    break;
                case 'down':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    break;
                case 'left':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    break;
                case 'right':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    break;
            }
        }

        // 触摸滑动支持
        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && direction.x === 0) nextDirection = { x: 1, y: 0 };
                else if (dx < 0 && direction.x === 0) nextDirection = { x: -1, y: 0 };
            } else {
                if (dy > 0 && direction.y === 0) nextDirection = { x: 0, y: 1 };
                else if (dy < 0 && direction.y === 0) nextDirection = { x: 0, y: -1 };
            }
        });

        // ==================== 响应式画布 ====================
        function resizeCanvas() {
            if (window.innerWidth < 500) {
                canvas.width = 300;
                canvas.height = 300;
                CONFIG.gridSize = 15;
                CONFIG.boardSize = 20;
            } else {
                canvas.width = 400;
                canvas.height = 400;
                CONFIG.gridSize = 20;
                CONFIG.boardSize = 20;
            }
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 初始绘制（等待开始）
        initGame();
        draw();
    </script>
</body>
</html>
