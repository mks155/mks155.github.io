<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: 'Arial', sans-serif;
            margin: 0;
        }
        #game-container {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        canvas {
            border: 5px solid #333;
            background-color: #e0ffe0; /* 游戏背景色 */
            display: block;
        }
        #score-board {
            margin-bottom: 15px;
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 1.2em;
            cursor: pointer;
            margin-top: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>🐍 贪吃蛇</h1>
        <div id="score-board">得分: 0</div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <button id="startButton">开始游戏</button>
        <p style="margin-top: 10px; font-size: 0.9em; color: #666;">使用方向键控制蛇的移动</p>
    </div>

    <script>
        // --------------------
        // 游戏常量和变量设置
        // --------------------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('score-board');
        const startButton = document.getElementById('startButton');

        const GRID_SIZE = 20; // 每个格子的大小 (20x20 像素)
        const TILE_COUNT = canvas.width / GRID_SIZE; // 20x20 的格子数
        let snake;
        let food;
        let dx = GRID_SIZE; // x方向速度 (初始向右)
        let dy = 0;        // y方向速度
        let score = 0;
        let gameLoopInterval;
        let gameSpeed = 150; // 游戏速度 (毫秒)
        let isRunning = false;

        // --------------------
        // 初始化函数
        // --------------------
        function initGame() {
            // 初始蛇：从中心开始，长度为 3
            snake = [
                { x: 5 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 4 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 3 * GRID_SIZE, y: 10 * GRID_SIZE }
            ];
            dx = GRID_SIZE;
            dy = 0;
            score = 0;
            scoreBoard.textContent = `得分: ${score}`;
            
            generateFood();
            drawGame(); // 绘制初始状态
            startButton.textContent = "重新开始";
            isRunning = false;
        }

        // --------------------
        // 辅助函数
        // --------------------
        function generateFood() {
            let newFood;
            let onSnake;

            do {
                // 随机生成格子坐标
                newFood = {
                    x: Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE,
                    y: Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE
                };
                // 确保食物不会出现在蛇的身体上
                onSnake = snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
            } while (onSnake);

            food = newFood;
        }

        // --------------------
        // 绘制函数
        // --------------------
        function drawGame() {
            // 1. 清空画布
            ctx.fillStyle = '#e0ffe0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 绘制食物 (红色圆点)
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x, food.y, GRID_SIZE, GRID_SIZE);

            // 3. 绘制蛇 (绿色方块)
            snake.forEach((segment, index) => {
                // 头部颜色和身体颜色略有不同
                ctx.fillStyle = index === 0 ? '#38a169' : '#68d391'; 
                ctx.fillRect(segment.x, segment.y, GRID_SIZE - 1, GRID_SIZE - 1); // 减1增加间隙美观
            });
        }

        // --------------------
        // 游戏核心逻辑
        // --------------------
        function updateGame() {
            if (!isRunning) return;

            // 1. 计算新的头部位置
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 2. 检查碰撞 (墙壁)
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                gameOver();
                return;
            }

            // 3. 检查碰撞 (自身)
            // 排除蛇的头部自身
            if (snake.slice(1).some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            // 4. 将新头部添加到蛇的头部
            snake.unshift(head);

            // 5. 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreBoard.textContent = `得分: ${score}`;
                generateFood(); // 生成新食物
                // 注意：这里不移除尾巴，实现蛇身增长
            } else {
                // 如果没吃到食物，移除尾巴，保持长度不变
                snake.pop();
            }

            // 6. 重新绘制游戏
            drawGame();
        }

        function gameOver() {
            isRunning = false;
            clearInterval(gameLoopInterval);
            alert(`游戏结束！你的最终得分是：${score}\n点击【重新开始】按钮再试一次！`);
            startButton.textContent = "重新开始";
        }

        // --------------------
        // 事件监听
        // --------------------

        // 键盘控制
        document.addEventListener('keydown', e => {
            // 阻止立即反向移动（例如：向右 -> 按左）
            const goingUp = dy === -GRID_SIZE;
            const goingDown = dy === GRID_SIZE;
            const goingLeft = dx === -GRID_SIZE;
            const goingRight = dx === GRID_SIZE;

            switch (e.key) {
                case 'ArrowUp':
                    if (!goingDown) { dx = 0; dy = -GRID_SIZE; }
                    break;
                case 'ArrowDown':
                    if (!goingUp) { dx = 0; dy = GRID_SIZE; }
                    break;
                case 'ArrowLeft':
                    if (!goingRight) { dx = -GRID_SIZE; dy = 0; }
                    break;
                case 'ArrowRight':
                    if (!goingLeft) { dx = GRID_SIZE; dy = 0; }
                    break;
            }
        });

        // 按钮事件
        startButton.addEventListener('click', () => {
            if (isRunning) {
                // 暂停/停止游戏
                isRunning = false;
                clearInterval(gameLoopInterval);
                startButton.textContent = "继续游戏";
            } else {
                // 启动或重新开始游戏
                initGame(); // 确保所有状态重置
                isRunning = true;
                // 设置游戏循环：每 gameSpeed 毫秒执行一次 updateGame
                gameLoopInterval = setInterval(updateGame, gameSpeed);
                startButton.textContent = "暂停游戏";
            }
        });

        // --------------------
        // 启动准备
        // --------------------
        initGame(); // 首次调用初始化，显示初始界面

    </script>
</body>
</html>
