<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <a class="back-home" href="/">← 主页</a>

  <div class="wrap">
    <header class="hero">
      <p class="eyebrow">文章</p>
      <h1><span>Articles</span></h1>
      <p>
        踩过坑才敢写下来的东西。多半是配置指南和踩坑记录。
      </p>
      <div class="meta-row">
        <span class="pill">收录：<strong id="article-count">0</strong> 篇</span>
        <span class="pill status-live" id="last-updated" title="最近一次更新的时间">最后更新：<strong>—</strong></span>
      </div>
    </header>

    <!-- 列表态 -->
    <section id="articles-list" aria-label="文章列表">
      <div class="toolbar">
        <h2>POSTS <em>LIST</em></h2>
      </div>
      <div class="art-list" id="art-cards"></div>
    </section>

    <!-- 阅读态 -->
    <section id="reader" hidden aria-label="文章正文">
      <div class="reader-bar">
        <button class="ghost-btn" type="button" data-back>← 返回列表</button>
        <div class="reader-head">
          <h2 id="reader-title"></h2>
          <div class="reader-meta">
            <span id="reader-meta"></span>
            <span class="tag-row" id="reader-tags"></span>
          </div>
        </div>
      </div>
      <article class="md-body" id="reader-body"></article>
    </section>
  </div>

  <p class="footer-note">
    文章以仓库内的 .md 原文为准
  </p>

  <script src="js/markdown.js?v=1"></script>
  <script src="js/data.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
</body>
</html>
